<style>
  /* Paleta unificada com o sistema de licitações */
  :root {
    --navy:      #1a3a6b;
    --navy-mid:  #1e4a8a;
    --navy-dark: #12294d;
    --navy-light:#2e5da8;
    --gold:      #e8a020;
    --gold-light:#f6b93b;
    --card:      #ffffff;
    --bg:        #eaeef6;
    --text:      #1c2433;
    --muted:     #6b7793;
    --border:    #dde4f0;
    --shadow:    0 2px 10px rgba(20,40,80,0.07);
    --shadow-md: 0 6px 22px rgba(20,40,80,0.10);
    --shadow-lg: 0 18px 50px rgba(15,30,70,0.22);
    --blue-bg:   #e7eefb;
    --blue-text: #1e4a8a;
    --green:     #2a8a3a;  --green-bg:  #e6f4ea;
    --red:       #c0282a;  --red-bg:    #fbe7e7;
    --amber:     #c07000;  --amber-bg:  #fef3dc;
    --radius:    18px;
    --ring:      0 0 0 3px rgba(46,93,168,0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', Arial, sans-serif; font-size: 15px;
    background:
      radial-gradient(1200px 600px at 100% -10%, rgba(46,93,168,0.10), transparent 60%),
      radial-gradient(900px 500px at -10% 0%, rgba(232,160,32,0.07), transparent 55%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text); min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(46,93,168,0.18); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(46,93,168,0.28); border-radius: 20px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: rgba(46,93,168,0.45); }

  header {
    background: #ffffff;
    padding: 0 32px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 3px 16px rgba(15,32,80,0.15);
    border-bottom: 4px solid; border-image: linear-gradient(90deg, var(--navy) 0%, var(--navy-light) 55%, var(--gold) 100%) 1;
  }
  .header-inner { max-width: 1440px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; min-height: 74px; gap: 20px; }
  .logo-wrap { display: flex; align-items: center; gap: 18px; }
.logo-mark { width: 46px; height: 46px; border-radius: 12px; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(26,58,107,0.18), inset 0 0 0 1.5px var(--border); flex-shrink: 0; padding: 6px; }
  .logo-mark img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .logo-divider { width: 2px; height: 44px; background: var(--border); border-radius: 2px; }
  .logo-text h1 { font-size: 18px; color: var(--navy); font-weight: 700; letter-spacing: 0.2px; line-height: 1.2; }
  .logo-text p { font-size: 11.5px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
  .header-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .btn-primary { background: linear-gradient(135deg, var(--navy), var(--navy-light)); color: #fff; border: none; padding: 10px 22px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; box-shadow: 0 3px 12px rgba(26,58,107,0.28); transition: box-shadow 0.18s, transform 0.12s, filter .15s; }
  .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(26,58,107,0.35); }
  .btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: #3d2800; border: none; padding: 10px 22px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; box-shadow: 0 3px 12px rgba(232,160,32,0.35); transition: box-shadow 0.18s, transform 0.12s, filter .15s; }
  .btn-gold:hover { filter: brightness(1.05); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(232,160,32,0.45); }
  .btn-ghost { background: var(--bg); color: var(--navy); border: 1.5px solid var(--border); padding: 9px 18px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.18s, border-color .15s; }
  .btn-ghost:hover { background: var(--blue-bg); border-color: var(--navy-light); }
  .btn-ghost.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .proto-chip { background: var(--amber-bg); color: var(--amber); font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; letter-spacing: .5px; }

  main { max-width: 1440px; margin: 0 auto; padding: 24px 32px 80px; }

  /* Barra de busca única, no estilo do Google: procura em tudo de uma vez.
     Os filtros por campo moraram aqui até virarem menu de coluna na tabela. */
  .busca-wrap { display: flex; justify-content: center; margin: 2px 0 16px; }
  .busca-box { display: flex; align-items: center; width: 100%; max-width: 780px; background: var(--card);
    border: 1.5px solid var(--border); border-radius: 28px; padding: 0 6px 0 18px;
    box-shadow: var(--shadow); transition: box-shadow .18s, border-color .18s; }
  .busca-box:hover { box-shadow: var(--shadow-md); }
  .busca-box:focus-within { border-color: var(--navy-light); box-shadow: var(--ring), var(--shadow-md); }
  .busca-ico { font-size: 15px; opacity: .5; flex-shrink: 0; }
  .busca-box input { flex: 1; min-width: 0; border: none; outline: none; background: none; font-family: inherit;
    font-size: 15px; color: var(--text); padding: 14px 12px; }
  .busca-box input::placeholder { color: #a3aec4; }
  .busca-x { border: none; background: none; color: var(--muted); font-size: 14px; cursor: pointer;
    padding: 8px 12px; border-radius: 50%; visibility: hidden; }
  .busca-x:hover { background: var(--blue-bg); color: var(--navy); }
  .busca-box.tem-texto .busca-x { visibility: visible; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: var(--blue-bg); color: var(--blue-text); border-radius: 20px; padding: 5px 12px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
  .chip b { cursor: pointer; opacity: .6; }
  .chip b:hover { opacity: 1; }
  .link-clear { background: none; border: none; color: var(--red); font-size: 12.5px; font-weight: 700; cursor: pointer; text-decoration: underline; }

  /* Toolbar da lista */
  .list-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 2px 12px; flex-wrap: wrap; }
  .result-count { font-size: 13.5px; color: var(--muted); }
  .result-count b { color: var(--navy); font-size: 16px; }
  .toolbar-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .sort-sel { padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 13px; background: #fbfcff; color: var(--text); outline: none; transition: border-color .15s, box-shadow .15s; }
  .sort-sel:focus { border-color: var(--navy-light); box-shadow: var(--ring); }

  /* ══ Tabela única — mesmo desenho do módulo licitacon ══ */
  .tab-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .tab { width: 100%; border-collapse: collapse; }
  /* Sem cabeçalho fixo: o Chromium resolve o `top` do sticky a partir da
     própria tabela, não da janela, e o cabeçalho acaba embaixo da primeira
     linha. Mesma lição aprendida no licitacon. */
  .tab th {
    background: #eef2fa; border-bottom: 1.5px solid var(--border);
    padding: 10px 9px; font-size: 10.5px; font-weight: 800; color: var(--navy);
    text-transform: uppercase; letter-spacing: .4px; text-align: left; white-space: nowrap;
  }
  .tab th.r { text-align: right; }
  /* Cabeçalho ordenável: um clique ordena, o mesmo clique de novo inverte. */
  .tab .th-titulos th { cursor: pointer; user-select: none; }
  .tab .th-titulos th:hover { background: #e2e9f7; color: var(--navy-light); }
  .tab .th-titulos th::after { content: "↕"; opacity: .28; margin-left: 4px; font-size: 10px; font-weight: 700; }
  .tab .th-titulos th.ord-asc::after { content: "▲"; opacity: 1; }
  .tab .th-titulos th.ord-desc::after { content: "▼"; opacity: 1; }
  .tab .th-titulos th.ord-asc, .tab .th-titulos th.ord-desc { background: #dfe8f8; }
  /* Filtro por coluna, no estilo do filtro de planilha: o botão abre um menu
     com as opções que aquela coluna tem, para marcar as que interessam. */
  .tab .th-filtros th { padding: 0 5px 8px; background: #eef2fa; border-bottom: 1.5px solid var(--border); }
  .cf {
    display: flex; align-items: center; justify-content: space-between; gap: 4px;
    width: 100%; min-width: 0; padding: 5px 7px; border: 1px solid var(--border); border-radius: 7px;
    font-family: inherit; font-size: 11.5px; font-weight: 600; background: #fff; color: var(--muted);
    text-align: left; cursor: pointer; text-transform: none; letter-spacing: 0;
  }
  .cf:hover { border-color: var(--navy-light); color: var(--navy); }
  .cf.ativo { background: var(--navy); border-color: var(--navy); color: #fff; }
  .cf-txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cf-seta { font-size: 8px; opacity: .6; flex-shrink: 0; }

  /* Menu da coluna (e o mesmo conteúdo dentro da folha de filtros do celular) */
  .pop { position: absolute; z-index: 700; width: 292px; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow-lg); display: none; flex-direction: column; overflow: hidden; }
  .pop.open { display: flex; }
  .pop-head { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 13px; border-bottom: 1px solid var(--border); }
  .pop-tit { font-size: 11.5px; font-weight: 800; color: var(--navy); text-transform: uppercase; letter-spacing: .6px; }
  .pop-x { border: none; background: none; color: var(--muted); font-size: 13px; cursor: pointer; padding: 2px 4px; }
  .pop-x:hover { color: var(--navy); }
  .pop-ord { display: flex; gap: 6px; padding: 9px 13px 0; }
  .pop-ord button { flex: 1; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: #fbfcff;
    font-family: inherit; font-size: 11.5px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .pop-ord button:hover { border-color: var(--navy-light); color: var(--navy); }
  .pop-ord button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .pop-busca { margin: 9px 13px; padding: 7px 10px; border: 1.5px solid var(--border); border-radius: 8px;
    font-family: inherit; font-size: 12.5px; color: var(--text); background: #fbfcff; outline: none; }
  .pop-busca:focus { border-color: var(--navy-light); box-shadow: 0 0 0 2px rgba(46,93,168,.14); background: #fff; }
  .pop-lista { overflow-y: auto; max-height: 292px; border-top: 1px solid var(--border); }
  .pop-grupo { font-size: 9.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .7px;
    padding: 9px 13px 5px; background: #f4f7fd; border-bottom: 1px solid var(--border); }
  .pop-op { display: flex; align-items: center; gap: 9px; padding: 6px 13px; font-size: 12.5px;
    color: var(--text); cursor: pointer; }
  .pop-op:hover { background: var(--blue-bg); }
  .pop-op input { width: 15px; height: 15px; accent-color: var(--navy-light); flex-shrink: 0; margin: 0; }
  .pop-op .op-txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pop-op .op-n { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .pop-op.todos { font-weight: 700; color: var(--navy); border-bottom: 1px solid var(--border); }
  .pop-vazio { padding: 14px 13px; font-size: 12px; color: var(--muted); text-align: center; }
  .pop-pe { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 9px 13px; border-top: 1px solid var(--border); background: #f4f7fd; }
  .pop-info { font-size: 11.5px; color: var(--muted); }

  /* Folha de filtros do celular: mesma lista, sem cabeçalho de tabela para clicar */
  .fm-linha { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%;
    padding: 13px 4px; border: none; border-bottom: 1px solid var(--border); background: none;
    font-family: inherit; font-size: 14px; color: var(--text); text-align: left; cursor: pointer; }
  .fm-linha:hover { background: var(--blue-bg); }
  .fm-nome { font-weight: 700; }
  .fm-val { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 55%; }
  .fm-val.on { color: var(--blue-text); font-weight: 700; }
  .fm-secao { font-size: 10.5px; font-weight: 800; color: var(--muted); text-transform: uppercase;
    letter-spacing: .7px; margin: 16px 0 2px; }
  .fm-voltar { border: none; background: none; color: var(--navy); font-family: inherit; font-size: 13px;
    font-weight: 700; cursor: pointer; padding: 0 0 10px; }
  .tab td { padding: 9px; border-bottom: 1px solid #eef1f8; font-size: 12.5px; vertical-align: top; line-height: 1.42; }
  .tab tbody tr:last-child td { border-bottom: none; }
  .tab tbody tr:nth-child(even) td { background: #fafbfe; }
  .tab tbody tr { cursor: pointer; }
  .tab tbody tr:hover td { background: var(--blue-bg); }

  .c-num { width: 10%; }
  .n-num { display: block; font-weight: 800; color: var(--navy); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .n-mod { display: block; font-size: 10.5px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
  .c-emp { width: 16%; font-weight: 600; word-break: break-word; }
  .c-obj { width: 26%; word-break: break-word; }
  .c-sec { width: 9%; color: var(--muted); word-break: break-word; }
  .c-tipo { width: 7%; color: var(--muted); }
  .c-fis { width: 9%; color: var(--muted); word-break: break-word; }
  .c-sit { width: 7%; white-space: nowrap; }
  .c-venc { width: 8%; white-space: nowrap; font-variant-numeric: tabular-nums; }
  /* O valor é o número que se compara entre contratos — é o destaque da linha */
  .c-valor { width: 9%; text-align: right; white-space: nowrap; font-size: 13.5px; font-weight: 800; color: var(--navy); font-variant-numeric: tabular-nums; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 20px; font-size: 10.5px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
  .badge-num { background: var(--navy); color: #fff; }
  .badge-sec { background: var(--blue-bg); color: var(--blue-text); }
  .badge-tipo { background: #f0e8f8; color: #6a20b0; }
  .badge-ativo { background: var(--green-bg); color: var(--green); }
  .badge-inativo { background: #eef0f5; color: #7c869c; }
  .badge-par { background: var(--amber-bg); color: var(--amber); }
  .bv-red { background: var(--red-bg); color: var(--red); }
  .bv-amber { background: var(--amber-bg); color: var(--amber); }
  .bv-green { background: var(--green-bg); color: var(--green); }
  .bv-gray { background: #eef0f5; color: #7c869c; }
  .load-wrap { text-align: center; margin-top: 18px; }
  .empty { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 15px; }
  .empty span { font-size: 40px; display: block; margin-bottom: 10px; }

  /* Modal */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(8,18,45,0.58); z-index: 600; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
  .overlay.open { display: flex; }
  .modal { background: var(--card); border-radius: 18px; box-shadow: var(--shadow-lg); width: 100%; max-width: 640px; margin: 20px; overflow: hidden; animation: slideUp 0.22s ease; max-height: 92vh; overflow-y: auto; }
  @keyframes slideUp { from { transform: translateY(22px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal-header { background: linear-gradient(135deg, var(--navy-dark), var(--navy)); padding: 19px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1; border-bottom: 3px solid var(--navy-light); }
  .modal-header h2 { font-size: 18px; color: #fff; font-weight: 700; }
  .modal-close { background: rgba(255,255,255,0.15); border: none; color: #fff; width: 30px; height: 30px; border-radius: 6px; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
  .modal-close:hover { background: rgba(255,255,255,0.30); }
  .modal-body { padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .modal-footer { padding: 15px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; background: #f7f9fd; position: sticky; bottom: 0; flex-wrap: wrap; }
  .det-row { display: grid; grid-template-columns: 150px 1fr; gap: 10px; font-size: 14px; }
  .det-row .k { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; padding-top: 2px; }
  .det-row .v { color: var(--text); line-height: 1.5; }
  .det-hr { border: none; border-top: 1px solid var(--border); }
  /* Modal relatórios */
  .rep-opt { display: flex; gap: 12px; align-items: flex-start; border: 1.5px solid var(--border); border-radius: 12px; padding: 14px; cursor: pointer; transition: border-color .15s, background .15s; }
  .rep-opt:hover { border-color: var(--navy-light); background: var(--blue-bg); }
  .rep-opt input { margin-top: 3px; accent-color: var(--navy); }
  .rep-opt .rt { font-weight: 700; color: var(--navy); font-size: 14.5px; }
  .rep-opt .rd { font-size: 12.5px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
  .rep-scope { display: flex; gap: 8px; flex-wrap: wrap; }
  #repSelWrap { border: 1.5px solid var(--border); border-radius: 14px; padding: 14px; background: #f7f9fd; }
  .sel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .sel-title { font-size: 12px; font-weight: 700; color: var(--navy); text-transform: uppercase; letter-spacing: .5px; }
  .sel-acts { display: flex; gap: 6px; }
  .mini-btn { background: #fff; border: 1.5px solid var(--border); color: var(--navy); border-radius: 20px; padding: 5px 12px; font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer; transition: border-color .15s, background .15s; }
  .mini-btn:hover { border-color: var(--navy-light); background: var(--blue-bg); }
  .sel-busca { width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 10px; font-family: inherit; font-size: 13.5px; background: #fff; outline: none; margin-bottom: 10px; }
  .sel-busca:focus { border-color: var(--navy-light); box-shadow: var(--ring); }
  .sel-list { display: flex; flex-wrap: wrap; gap: 7px; max-height: 190px; overflow-y: auto; padding: 2px; }
  .sel-item { display: inline-flex; align-items: center; gap: 7px; background: #fff; border: 1.5px solid var(--border); border-radius: 20px; padding: 7px 13px; font-size: 12.5px; font-weight: 600; color: var(--text); cursor: pointer; user-select: none; transition: all .14s; }
  .sel-item:hover { border-color: var(--navy-light); }
  .sel-item.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .sel-item input { display: none; }
  .sel-item .tick { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--muted); display: inline-flex; align-items: center; justify-content: center; font-size: 10px; color: transparent; flex-shrink: 0; }
  .sel-item.on .tick { background: var(--gold); border-color: var(--gold); color: #3d2800; }
  .sel-item .qt { opacity: .6; font-weight: 700; font-size: 11px; }
  .sel-count { font-size: 12px; color: var(--muted); margin-top: 9px; font-weight: 600; }
  .sel-count b { color: var(--navy); }

  .only-mobile { display: none; }
  .mobile-bar { display: none; }

  @media (max-width: 1100px) { .dash-grid { grid-template-columns: 1fr; } }
  /* ═══════════ CELULAR ═══════════ */
  @media (max-width: 860px) {
    .only-mobile { display: inline-block; }
    header { padding: 0 14px; }
    .header-inner { min-height: 62px; gap: 10px; }
    .logo-mark { width: 38px; height: 38px; border-radius: 10px; padding: 5px; }
    .logo-divider { display: none; }
    .logo-wrap { gap: 11px; }
    .logo-text h1 { font-size: 15.5px; }
    .logo-text p { font-size: 9.5px; letter-spacing: .6px; }
    .header-actions .btn-ghost, .header-actions .btn-gold, .proto-chip { display: none; }

    main { padding: 14px 12px 96px; }

    /* 16px evita o zoom automático do navegador ao focar o campo */
    .busca-wrap { margin: 0 0 12px; }
    .busca-box { padding: 0 4px 0 14px; }
    .busca-box input, .sel-busca { font-size: 16px; }
    .busca-box input { padding: 12px 10px; }
    .chips { width: 100%; }

    /* Sem cabeçalho de tabela para clicar, os filtros de coluna viram uma
       folha: a lista das colunas e, ao tocar em uma, as opções dela. */
    .pop { position: fixed; left: 8px !important; right: 8px; top: auto !important; bottom: 8px;
      width: auto; max-height: 74vh; }
    .pop-lista { max-height: 46vh; }
    .pop-busca { font-size: 16px; }

    /* lista */
    .list-toolbar { gap: 8px; }
    .toolbar-right { width: 100%; }
    .toolbar-right label { display: none; }
    .sort-sel { flex: 1; font-size: 16px; }
    .toolbar-right .btn-primary { display: none; }
    .btn-filtros { flex: 1; }
    /* A tabela deixa de ser tabela: cada linha vira um bloco, com a empresa
       de título e o valor em destaque. Tabela de 9 colunas espremida em
       390px quebra palavra no meio e fica ilegível. */
    .tab-box { border-radius: 14px; }
    .tab, .tab tbody, .tab tr { display: block; width: 100%; }
    .tab thead { display: none; }
    .tab tr { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 9px;
      padding: 14px 14px 15px; border-bottom: 1px solid var(--border); }
    .tab tbody tr:last-child { border-bottom: none; }
    .tab tbody tr:nth-child(even), .tab tbody tr:nth-child(even) td,
    .tab tbody tr:hover td { background: transparent; }
    .tab td { display: inline; padding: 0; border: none; width: auto; }
    .tab td::before { content: ""; }
    .tab td.vazia { display: none; }
    .badge { font-size: 10.5px; padding: 3px 8px; }

    /* 1) a empresa contratada */
    .tab .c-emp { order: 1; flex: 0 0 100%; font-size: 14.5px; font-weight: 700;
      color: var(--text); line-height: 1.4; margin-bottom: 3px; }
    /* 2) o objeto do contrato */
    .tab .c-obj { order: 2; flex: 0 0 100%; font-size: 12.5px; color: var(--muted);
      line-height: 1.45; margin-bottom: 8px; }
    /* 3) o valor, que é o número que se compara */
    .tab .c-valor { order: 3; width: auto; text-align: left; font-size: 19px; font-weight: 800; color: var(--navy); }
    /* 4) situação e vencimento, que é o que decide se o contrato preocupa */
    .tab .c-sit { order: 4; }
    .tab .c-venc { order: 5; }
    /* 5) o resto, discreto, no pé */
    .tab .c-sec { order: 6; flex: 0 0 100%; margin-top: 9px; font-size: 11px; }
    .tab .c-sec::before { content: "secretaria "; }
    .tab .c-fis { order: 7; flex: 0 0 100%; font-size: 11px; }
    .tab .c-fis::before { content: "fiscais "; }
    .tab .c-num { order: 8; flex: 1 1 auto; margin-top: 8px; font-size: 11px; }
    .tab .c-num .n-num, .tab .c-num .n-mod { display: inline; font-size: 11px; }
    .tab .c-num .n-num { color: var(--navy); }
    .tab .c-num .n-mod { color: var(--muted); margin-left: 5px; }
    .tab .c-tipo { order: 9; margin-top: 8px; font-size: 11px; color: var(--muted); }

    /* modais como folha inferior */
    .overlay { align-items: flex-end; }
    .modal { margin: 0; border-radius: 20px 20px 0 0; max-width: 100%; max-height: 90vh; }
    .modal-header { padding: 16px 18px; }
    .modal-header h2 { font-size: 16px; }
    .modal-close { width: 34px; height: 34px; }
    .modal-body { padding: 18px; gap: 12px; }
    .modal-footer { padding: 13px 18px calc(13px + env(safe-area-inset-bottom)); }
    .modal-footer button { flex: 1; padding: 13px 16px; justify-content: center; }
    .det-row { grid-template-columns: 1fr; gap: 2px; }
    .rep-opt { padding: 13px 12px; }
    .sel-list { max-height: 168px; }
    .sel-item { padding: 9px 13px; font-size: 13px; }

    /* barra de ações fixa embaixo */
    .mobile-bar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 300; gap: 8px;
      padding: 9px 12px calc(9px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.94); backdrop-filter: blur(10px);
      border-top: 1px solid var(--border); box-shadow: 0 -4px 18px rgba(20,40,80,0.09); }
    .mb-btn { flex: 1; border: none; border-radius: 11px; padding: 12px 6px; font-family: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .mb-primary { background: linear-gradient(135deg, var(--navy), var(--navy-light)); color: #fff; }
    .mb-gold { background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: #3d2800; }
    .load-wrap .btn-ghost { width: 100%; padding: 13px; }
  }

  @media (max-width: 380px) {
    .mb-btn { font-size: 11.5px; padding: 11px 4px; }
  }
</style>
</head>

<main>
  <!-- BUSCA ÚNICA: procura em tudo. Os filtros ficam dentro da tabela. -->
  <div class="busca-wrap">
    <div class="busca-box" id="buscaBox">
      <span class="busca-ico">🔎</span>
      <input type="text" id="fBusca" autocomplete="off" spellcheck="false"
             placeholder="Pesquisar em tudo — empresa, objeto, nº, fiscal, secretaria, valor…"
             oninput="aplicarFiltros()">
      <button class="busca-x" onclick="limparBusca()" title="Limpar a busca">✕</button>
    </div>
  </div>

  <!-- LISTA -->
  <div class="list-toolbar">
    <div class="result-count" id="resultCount"></div>
    <div class="chips" id="chipsAtivos"></div>
    <div class="toolbar-right">
      <button class="btn-ghost btn-filtros only-mobile" onclick="abrirFiltrosMobile()">⚙️ Filtros e ordem</button>
      <button class="link-clear" onclick="limparFiltros()">✕ Limpar filtros</button>
      <button class="btn-primary" onclick="pdfDoFiltro()" title="Gera um PDF exatamente com os contratos filtrados abaixo">🖨️ PDF do filtro atual</button>
    </div>
  </div>

  <div class="tab-box">
    <table class="tab">
      <thead>
        <tr class="th-titulos">
          <th data-ord="num"   onclick="ordenarPor('num')">Contrato</th>
          <th data-ord="emp"   onclick="ordenarPor('emp')">Empresa</th>
          <th data-ord="obj"   onclick="ordenarPor('obj')">Objeto</th>
          <th data-ord="sec"   onclick="ordenarPor('sec')">Secretaria</th>
          <th data-ord="tipo"  onclick="ordenarPor('tipo')">Tipo</th>
          <th data-ord="fis"   onclick="ordenarPor('fis')">Fiscais</th>
          <th data-ord="sit"   onclick="ordenarPor('sit')">Situação</th>
          <th data-ord="venc"  onclick="ordenarPor('venc')">Vencimento</th>
          <th data-ord="valor" onclick="ordenarPor('valor')" class="r">Valor</th>
        </tr>
        <!-- Cada coluna abre o próprio menu de opções, como o filtro de uma planilha -->
        <tr class="th-filtros">
          <th><button class="cf" data-col="num"   onclick="abrirFiltroCol(event,'num')"><span class="cf-txt">Todos</span><span class="cf-seta">▼</span></button></th>
          <th><button class="cf" data-col="emp"   onclick="abrirFiltroCol(event,'emp')"><span class="cf-txt">Todas</span><span class="cf-seta">▼</span></button></th>
          <th><button class="cf" data-col="obj"   onclick="abrirFiltroCol(event,'obj')"><span class="cf-txt">Todos</span><span class="cf-seta">▼</span></button></th>
          <th><button class="cf" data-col="sec"   onclick="abrirFiltroCol(event,'sec')"><span class="cf-txt">Todas</span><span class="cf-seta">▼</span></button></th>
          <th><button class="cf" data-col="tipo"  onclick="abrirFiltroCol(event,'tipo')"><span class="cf-txt">Todos</span><span class="cf-seta">▼</span></button></th>
          <th><button class="cf" data-col="fis"   onclick="abrirFiltroCol(event,'fis')"><span class="cf-txt">Todos</span><span class="cf-seta">▼</span></button></th>
          <th><button class="cf" data-col="sit"   onclick="abrirFiltroCol(event,'sit')"><span class="cf-txt">Todas</span><span class="cf-seta">▼</span></button></th>
          <th><button class="cf" data-col="venc"  onclick="abrirFiltroCol(event,'venc')"><span class="cf-txt">Todos</span><span class="cf-seta">▼</span></button></th>
          <th><button class="cf" data-col="valor" onclick="abrirFiltroCol(event,'valor')"><span class="cf-txt">Todos</span><span class="cf-seta">▼</span></button></th>
        </tr>
      </thead>
      <tbody id="corpo"></tbody>
    </table>
    <div id="vazio"></div>
  </div>
  <div class="load-wrap" id="loadWrap" style="display:none">
    <button class="btn-ghost" onclick="renderMais()" id="btnMais">Carregar mais contratos ↓</button>
  </div>
</main>

<!-- MENU DE FILTRO DA COLUNA (um só, reaproveitado por todas as colunas) -->
<div class="pop" id="popFiltro">
  <div class="pop-head">
    <span class="pop-tit" id="popTit">Coluna</span>
    <button class="pop-x" onclick="fecharPop()" title="Fechar">✕</button>
  </div>
  <div class="pop-ord">
    <button id="popOrdAsc"  onclick="popOrdenar('asc')">↑ A–Z</button>
    <button id="popOrdDesc" onclick="popOrdenar('desc')">↓ Z–A</button>
  </div>
  <input class="pop-busca" id="popBusca" autocomplete="off" spellcheck="false"
         placeholder="Buscar nesta coluna…" oninput="popDigitou()">
  <div class="pop-lista" id="popLista"></div>
  <div class="pop-pe">
    <button class="link-clear" onclick="popLimpar()">✕ Limpar esta coluna</button>
    <span class="pop-info" id="popInfo"></span>
  </div>
</div>

<!-- FILTROS NO CELULAR: sem cabeçalho de tabela, as colunas viram uma lista -->
<div class="overlay" id="ovFiltros" onclick="if(event.target===this)fecharFiltrosMobile()">
  <div class="modal" style="max-width:520px">
    <div class="modal-header"><h2>⚙️ Filtros e ordem</h2><button class="modal-close" onclick="fecharFiltrosMobile()">✕</button></div>
    <div class="modal-body">
      <div class="fm-secao">Filtrar por coluna</div>
      <div id="fmLista"></div>
      <div class="fm-secao">Ordenar por</div>
      <select class="sort-sel" id="fSort" onchange="aplicarFiltros()">
        <optgroup label="Vencimento">
          <option value="venc-asc" selected>Vencimento — mais próximo primeiro</option>
          <option value="venc-desc">Vencimento — mais distante primeiro</option>
        </optgroup>
        <optgroup label="Valor">
          <option value="valor-desc">Valor — do maior para o menor</option>
          <option value="valor-asc">Valor — do menor para o maior</option>
        </optgroup>
        <optgroup label="Texto">
          <option value="num-desc">Nº do contrato (mais recente)</option>
          <option value="num-asc">Nº do contrato (mais antigo)</option>
          <option value="emp-asc">Empresa (A–Z)</option>
          <option value="emp-desc">Empresa (Z–A)</option>
          <option value="obj-asc">Objeto (A–Z)</option>
          <option value="sec-asc">Secretaria (A–Z)</option>
          <option value="tipo-asc">Tipo (A–Z)</option>
          <option value="fis-asc">Fiscais (A–Z)</option>
          <option value="sit-asc">Situação (A–Z)</option>
        </optgroup>
      </select>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px">
        <button class="link-clear" onclick="limparFiltros()">✕ Limpar todos os filtros</button>
        <button class="btn-primary" id="fmVer" onclick="fecharFiltrosMobile()">Ver resultados</button>
      </div>
    </div>
  </div>
</div>

<!-- Barra de ações fixa (apenas no celular) -->
<div class="mobile-bar">
  <button class="mb-btn mb-primary" onclick="pdfDoFiltro()">🖨️ PDF do filtro</button>
  <button class="mb-btn mb-gold" onclick="abrirModalRelatorio()">📄 Relatórios</button>
</div>

<!-- MODAL DETALHE -->
<div class="overlay" id="ovDet" onclick="if(event.target===this)fecharDet()">
  <div class="modal">

      <label class="rep-opt"><input type="radio" name="repTipo" value="fiscal" onchange="onTipoRel()">

<script>
/* ══════════════ DADOS ══════════════
   Os 1.264 contratos moravam aqui dentro, numa única linha de 724 KB. O
   navegador baixava o cadastro inteiro junto com o HTML a cada visita, e
   corrigir um contrato era editar o código-fonte.

   Agora vêm de fora, nesta ordem:
     1. do Firestore próprio dos contratos, se FIREBASE_CONFIG estiver
        preenchido — projeto SEPARADO do das licitações, de propósito;
     2. senão, de dados/contratos.json, a mesma lista versionada no
        repositório. A tela funciona igual, só não recebe alteração viva.

   Ver contratos/LEIA-ME.md. */
const FIREBASE_CONFIG = {};   /* ← config do projeto de contratos entra aqui */

let CONTRATOS = [];
let FONTE_DADOS = 'arquivo';

function carregarSDK(){
  const urls = ['app','firestore'].map(m =>
    'https://www.gstatic.com/firebasejs/10.12.0/firebase-'+m+'-compat.js');
  return urls.reduce((p,u) => p.then(() => new Promise((ok,err) => {
    const s = document.createElement('script');
    s.src = u; s.onload = ok; s.onerror = () => err(new Error('não carregou '+u));
    document.head.appendChild(s);
  })), Promise.resolve());
}

/* O id do documento no Firestore é texto; quem manda é o campo `id` numérico
   de dentro — é ele que a tela usa em abrirDet(). Ignorar o id do documento
   evita comparar "12" com 12. */
function carregarDoFirestore(){
  return carregarSDK()
    .then(() => { firebase.initializeApp(FIREBASE_CONFIG); return firebase.firestore().collection('contratos').get(); })
    .then(snap => snap.docs.map(d => d.data()));
}

function carregarDoArquivo(){
  return fetch('dados/contratos.json', {cache:'no-cache'}).then(r => {
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  });
}

function carregarContratos(){
  const temConfig = FIREBASE_CONFIG && FIREBASE_CONFIG.projectId;
  const tentativa = temConfig
    ? carregarDoFirestore().then(d => { FONTE_DADOS = 'firestore'; return d; })
        .catch(e => { console.warn('Firestore indisponível, caindo para o arquivo:', e); return carregarDoArquivo(); })
    : carregarDoArquivo();
  return tentativa.then(d => {
    if(!Array.isArray(d) || !d.length) throw new Error('lista de contratos vazia');
    /* os campos de lista precisam existir: fiscais() e os filtros contam com isso */
    return d.map(c => Object.assign({fiscalAdm:[], fiscalTec:[], secretarias:[]}, c));
  });
}

/* ══════════════ UTILIDADES ══════════════ */
const HOJE = new Date(); HOJE.setHours(0,0,0,0);
const fmtBRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
function money(v){ return (v==null||isNaN(v)) ? '—' : fmtBRL.format(v); }
function parseD(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtD(s){ const d=parseD(s); return d ? d.toLocaleDateString('pt-BR') : '—'; }
function dias(s){ const d=parseD(s); return d===null ? null : Math.round((d-HOJE)/864e5); }
function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function isAtivo(c){ return c.situacao==='ATIVO' || c.situacao==='ATIVO-PARALIZADO'; }
function fiscais(c){ return [...c.fiscalAdm, ...c.fiscalTec]; }


/* ══════════════ ESTADO ══════════════ */
/* Uma busca só, que varre tudo — e o resto do filtro mora dentro da tabela:
   cada coluna guarda o texto digitado no menu dela e as opções marcadas. */
const F = { busca:'', sort:'venc-asc' };
const COLF = {};   /* col -> { txt:'', sel:{ grupo: Set(valores marcados) } } */
let filtrados = [], mostrando = 0;
const LOTE = 100;

const NOME_COL = {num:'Contrato', emp:'Empresa', obj:'Objeto', sec:'Secretaria', tipo:'Tipo',
                  fis:'Fiscais', sit:'Situação', venc:'Vencimento', valor:'Valor'};
const COLUNAS = Object.keys(NOME_COL);

/* O texto de cada coluna do jeito que aparece na tela — é sobre ele que a
   busca da coluna casa, então procurar "2.226" acha "R$ 2.226.275,67" e
   procurar "2023" acha a data de vencimento. */
const TEXTO_COL = {
  num:   c => 'nº '+c.contr+'/'+c.ano+' '+(c.modalidade||''),
  emp:   c => c.empresa||'',
  obj:   c => c.objeto||'',
  sec:   c => (c.secretarias||[]).join(' '),
  tipo:  c => c.tipo||'',
  fis:   c => fiscais(c).join(' '),
  sit:   c => c.situacao||'',
  venc:  c => fmtD(c.vencimento),
  valor: c => money(c.valor),
};

/* Como cada coluna se ordena. Número ordena por número (senão
   "R$ 1.000,00" viria antes de "R$ 9,00"); texto por localeCompare. */
const VALOR_ORD = {
  num:   c => String(c.ano)+'-'+String(c.contr).padStart(8,'0'),
  emp:   c => c.empresa||'',
  obj:   c => c.objeto||'',
  sec:   c => (c.secretarias||[]).join(', '),
  tipo:  c => c.tipo||'',
  fis:   c => fiscais(c).join(', '),
  sit:   c => c.situacao||'',
  /* contrato sem data vai para o fim, tanto crescente quanto decrescente */
  venc:  c => c._d===null ? 1e9 : c._d,
  valor: c => c.valor||0,
};
/* Nestas o primeiro clique mostra o MAIOR primeiro; nas de texto, A→Z. */
const ORD_DESC_PRIMEIRO = ['valor','num'];

/* ══════════════ OPÇÕES DE CADA COLUNA ══════════════
   As opções que o menu da coluna oferece para marcar. Vencimento e Valor não
   listam o valor em si (seria uma data e um número diferentes por contrato):
   oferecem faixas, que é o recorte que alguém realmente pede. */
const FAIXAS_PRAZO = [
  ['Vencidos',              c => c._d !== null && c._d < 0],
  ['Vence em até 30 dias',  c => c._d !== null && c._d >= 0 && c._d <= 30],
  ['Vence em até 60 dias',  c => c._d !== null && c._d >= 0 && c._d <= 60],
  ['Vence em até 90 dias',  c => c._d !== null && c._d >= 0 && c._d <= 90],
  ['Vence em até 180 dias', c => c._d !== null && c._d >= 0 && c._d <= 180],
  ['Vence este ano',        c => { const d = parseD(c.vencimento); return !!d && d >= HOJE && d.getFullYear() === HOJE.getFullYear(); }],
  ['Sem data',              c => c._d === null],
];
const FAIXAS_VALOR = [
  ['Até R$ 50 mil',            v => v <= 5e4],
  ['R$ 50 mil a R$ 100 mil',   v => v >  5e4 && v <= 1e5],
  ['R$ 100 mil a R$ 500 mil',  v => v >  1e5 && v <= 5e5],
  ['R$ 500 mil a R$ 1 milhão', v => v >  5e5 && v <= 1e6],
  ['R$ 1 milhão a R$ 5 milhões', v => v > 1e6 && v <= 5e6],
  ['Acima de R$ 5 milhões',    v => v >  5e6],
];
function faixasPrazo(c){ return FAIXAS_PRAZO.filter(f => f[1](c)).map(f => f[0]); }
function faixaValor(c){
  const v = c.valor;
  if(v == null || isNaN(v)) return ['(sem valor)'];
  const f = FAIXAS_VALOR.find(x => x[1](v));
  return [f ? f[0] : '(sem valor)'];
}
/* "CONC. 02/2008" → "CONC"; "PE 168/2022" → "PE". A modalidade inteira daria
   mil opções diferentes (uma por contrato); a sigla é o que agrupa. */
function siglaModalidade(c){
  const s = String(c.modalidade || '').toUpperCase().split(/\d/)[0].replace(/[.,\-/\s]+$/,'').trim();
  return s || '(sem modalidade)';
}
function anoVencimento(c){ const d = parseD(c.vencimento); return [d ? String(d.getFullYear()) : '(sem data)']; }

const FACETAS = {
  num:   [ {k:'ano',   t:'Ano do contrato', v:c=>[c.ano ? String(c.ano) : '(sem ano)'], desc:true},
           {k:'mod',   t:'Modalidade',      v:c=>[siglaModalidade(c)]} ],
  emp:   [ {k:'emp',   t:'Empresa',         v:c=>[c.empresa || '(sem empresa)']} ],
  obj:   [ {k:'pal',   t:'Palavra-chave',   v:c=>[c.palavra || '(sem palavra-chave)']} ],
  sec:   [ {k:'sec',   t:'Secretaria',      v:c=>c.secretarias.length ? c.secretarias : ['(sem secretaria)']} ],
  tipo:  [ {k:'tipo',  t:'Tipo',            v:c=>[c.tipo || '(sem tipo)']} ],
  fis:   [ {k:'fis',   t:'Fiscal',          v:c=>fiscais(c).length ? fiscais(c) : ['(sem fiscal)']} ],
  sit:   [ {k:'sit',   t:'Situação',        v:c=>[c.situacao || '(sem situação)']} ],
  venc:  [ {k:'prazo', t:'Prazo',           v:faixasPrazo, ordemFixa:FAIXAS_PRAZO.map(f=>f[0])},
           {k:'anoV',  t:'Ano do vencimento', v:anoVencimento, desc:true} ],
  valor: [ {k:'faixa', t:'Faixa de valor',  v:faixaValor, ordemFixa:FAIXAS_VALOR.map(f=>f[0]).concat('(sem valor)')} ],
};

/* Tudo o que um contrato tem, em uma linha só — é onde a busca de cima procura. */
function textoTudo(c){
  if(c._txt === undefined){
    c._txt = normalizar([c.contr+'/'+c.ano, c.empresa, c.objeto, c.palavra, c.modalidade,
              (c.secretarias||[]).join(' '), fiscais(c).join(' '), c.tipo, c.situacao,
              c.obs, fmtD(c.vencimento), money(c.valor)].join(' '));
  }
  return c._txt;
}
/* Sem acento e em minúsculas: quem digita "servico" acha "SERVIÇO". */
function normalizar(s){
  return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function initFiltros(){
  COLUNAS.forEach(col => {
    COLF[col] = {txt:'', sel:{}};
    (FACETAS[col] || []).forEach(g => { COLF[col].sel[g.k] = new Set(); });
  });
  /* A tela abre nos contratos que ainda valem — inativo é histórico. */
  COLF.sit.sel.sit = new Set(['ATIVO','ATIVO-PARALIZADO']);
}

/* ══════════════ FILTRAGEM ══════════════ */
/* A busca de cima: cada palavra digitada tem de aparecer em algum lugar do
   contrato — objeto, empresa, fiscal, secretaria, data, valor, observação. */
function passaBusca(c){
  if(!F.busca) return true;
  const alvo = textoTudo(c);
  for(const termo of F.busca.split(/\s+/)) if(!alvo.includes(termo)) return false;
  return true;
}
/* Uma coluna deixa o contrato passar quando o texto digitado no menu dela casa
   E ele está entre as opções marcadas. Nenhuma opção marcada = não filtra. */
function passaColuna(c, col){
  const f = COLF[col];
  if(!f) return true;
  if(f.txt && !normalizar(TEXTO_COL[col](c)).includes(f.txt)) return false;
  for(const g of (FACETAS[col] || [])){
    const sel = f.sel[g.k];
    if(sel && sel.size && !g.v(c).some(v => sel.has(v))) return false;
  }
  return true;
}
function aplicarFiltros(sortForcado){
  F.busca = normalizar(document.getElementById('fBusca').value.trim());
  /* sortForcado só chega pelo clique no cabeçalho, quando a combinação não
     existe no seletor (aí ele fica em branco e quem manda é este valor) */
  F.sort = sortForcado || document.getElementById('fSort').value || F.sort;

  filtrados = CONTRATOS.filter(c => passaBusca(c) && COLUNAS.every(col => passaColuna(c, col)));

  ordenar();
  mostrando = 0;
  document.getElementById('corpo').innerHTML = '';
  document.getElementById('vazio').innerHTML = '';
  renderMais();
  renderChips();
  marcarSetas();
  marcarBotoesColuna();
  document.getElementById('buscaBox').classList.toggle('tem-texto', !!document.getElementById('fBusca').value);
}
function ordenar(){
  const [campo, dir] = String(F.sort).split('-');
  const valor = VALOR_ORD[campo];
  if(!valor) return;
  const sinal = (dir === 'asc') ? 1 : -1;
  filtrados.sort((a,b)=>{
    const x = valor(a), y = valor(b);
    if(typeof x === 'number') return (x - y) * sinal;
    return String(x).localeCompare(String(y), 'pt-BR') * sinal;
  });
}
/* Clique no cabeçalho: ordena por aquela coluna; clicar de novo inverte. O
   seletor "ORDENAR" acompanha, para os dois nunca mostrarem coisas
   diferentes (e para o celular, onde não há cabeçalho para clicar). */
function ordenarPor(campo, dirForcada){
  const [atual, dir] = String(F.sort).split('-');
  let nova;
  if(dirForcada) nova = campo + '-' + dirForcada;
  else if(atual === campo) nova = campo + (dir === 'asc' ? '-desc' : '-asc');
  else nova = campo + (ORD_DESC_PRIMEIRO.indexOf(campo) >= 0 ? '-desc' : '-asc');
  const sel = document.getElementById('fSort');
  if([...sel.options].some(o => o.value === nova)) sel.value = nova;
  else { F.sort = nova; sel.value = ''; }
  aplicarFiltros(nova);
}
function marcarSetas(){
  const [campo, dir] = String(F.sort).split('-');
  document.querySelectorAll('.th-titulos th').forEach(th => {
    th.classList.remove('ord-asc','ord-desc');
    if(th.dataset.ord === campo) th.classList.add(dir === 'asc' ? 'ord-asc' : 'ord-desc');
  });
}
function limparBusca(){
  document.getElementById('fBusca').value = '';
  aplicarFiltros();
  document.getElementById('fBusca').focus();
}
function limparFiltros(){
  document.getElementById('fBusca').value = '';
  initFiltros();
  aplicarFiltros();
  if(popCol) renderPop();
  if(sheetAberta()) renderFiltrosMobile();
}
/* Zera um pedaço do filtro de uma coluna — o texto, um grupo de opções, ou
   (sem `parte`) a coluna inteira. */
function limparColuna(col, parte){
  const f = COLF[col];
  if(!f) return;
  const tudo = !parte;
  if(tudo || parte === 'txt'){
    f.txt = '';
    if(popCol === col) document.getElementById('popBusca').value = '';
  }
  Object.keys(f.sel).forEach(k => { if(tudo || parte === k) f.sel[k].clear(); });
  aplicarFiltros();
  if(popCol) renderPop();
  if(sheetAberta()) renderFiltrosMobile();
}

/* ══════════════ O QUE CADA COLUNA MOSTRA NO BOTÃO E NOS CHIPS ══════════════ */
const COL_FEMININA = ['emp','sec','sit'];   /* "Todas" em vez de "Todos" */
function resumoColuna(col){
  const f = COLF[col], partes = [];
  if(f.txt) partes.push('“'+f.txt+'”');
  (FACETAS[col] || []).forEach(g => {
    const sel = f.sel[g.k];
    if(!sel || !sel.size) return;
    partes.push(sel.size === 1 ? [...sel][0] : sel.size + ' opções');
  });
  return partes.join(' · ');
}
function marcarBotoesColuna(){
  document.querySelectorAll('.cf').forEach(b => {
    const col = b.dataset.col, r = resumoColuna(col);
    b.classList.toggle('ativo', !!r);
    b.querySelector('.cf-txt').textContent = r || (COL_FEMININA.includes(col) ? 'Todas' : 'Todos');
    b.title = r ? NOME_COL[col]+': '+r : 'Filtrar por '+NOME_COL[col];
  });
}
function renderChips(){
  const c = [];
  const mk = (txt, fn) => `<span class="chip">${esc(txt)} <b onclick="${fn}">✕</b></span>`;
  COLUNAS.forEach(col => {
    const f = COLF[col];
    if(f.txt) c.push(mk(NOME_COL[col]+': '+f.txt, `limparColuna('${col}','txt')`));
    (FACETAS[col] || []).forEach(g => {
      const sel = f.sel[g.k];
      if(!sel || !sel.size) return;
      const vals = [...sel];
      c.push(mk(g.t+': '+(vals.length <= 2 ? vals.join(', ') : vals.length+' selecionadas'),
                `limparColuna('${col}','${g.k}')`));
    });
  });
  document.getElementById('chipsAtivos').innerHTML = c.join('');
}

/* ══════════════ MENU DE FILTRO DA COLUNA ══════════════
   Um único menu, reaproveitado por todas as colunas: lista as opções que
   aquela coluna tem, com quantos contratos cada uma traz considerando os
   filtros já aplicados nas outras colunas — como o filtro de uma planilha. */
let popCol = null;
function isMobile(){ return window.matchMedia ? window.matchMedia('(max-width: 860px)').matches : (window.innerWidth||999) <= 860; }

function abrirFiltroCol(ev, col, alvo){
  if(ev) ev.stopPropagation();
  if(popCol === col){ fecharPop(); return; }
  popCol = col;
  document.getElementById('popFiltro').classList.add('open');
  document.getElementById('popTit').textContent = NOME_COL[col];
  const busca = document.getElementById('popBusca');
  busca.value = COLF[col].txt;
  busca.placeholder = 'Buscar em '+NOME_COL[col].toLowerCase()+'…';
  renderPop();
  posicionarPop(alvo || (ev && ev.currentTarget));
  if(!isMobile()) busca.focus();
}
function fecharPop(){
  popCol = null;
  document.getElementById('popFiltro').classList.remove('open');
}
function posicionarPop(alvo){
  if(isMobile() || !alvo || !alvo.getBoundingClientRect) return;  /* no celular vira folha embaixo */
  const pop = document.getElementById('popFiltro');
  const r = alvo.getBoundingClientRect();
  const larg = pop.offsetWidth || 292;
  const maxEsq = document.documentElement.clientWidth - larg - 10;
  pop.style.left = (Math.max(8, Math.min(r.left, maxEsq)) + window.scrollX) + 'px';
  pop.style.top  = (r.bottom + window.scrollY + 5) + 'px';
}
/* Quantos contratos cada opção traria — contando com os filtros das OUTRAS
   colunas, mas não com o desta, senão a lista se apagaria sozinha. */
function contarOpcoes(col){
  const base = CONTRATOS.filter(c => passaBusca(c) && COLUNAS.every(o => o === col || passaColuna(c, o)));
  const mapa = {};
  (FACETAS[col] || []).forEach(g => {
    const m = new Map();
    base.forEach(c => g.v(c).forEach(v => m.set(v, (m.get(v) || 0) + 1)));
    mapa[g.k] = m;
  });
  return mapa;
}
function ordenarValores(vals, g){
  if(g.ordemFixa) return g.ordemFixa.filter(v => vals.indexOf(v) >= 0);
  const s = vals.sort((a,b) => String(a).localeCompare(String(b), 'pt-BR'));
  return g.desc ? s.reverse() : s;
}
/* As opções visíveis de um grupo: as que existem hoje mais as já marcadas
   (senão uma opção que zerou não teria como ser desmarcada). */
function opcoesGrupo(col, g, mapa, busca){
  const sel = COLF[col].sel[g.k];
  const vals = ordenarValores([...new Set([...mapa.keys(), ...sel])], g);
  return busca ? vals.filter(v => normalizar(v).includes(busca)) : vals;
}
function renderPop(){
  const col = popCol;
  if(!col) return;
  const busca = normalizar(document.getElementById('popBusca').value);
  const mapa = contarOpcoes(col);
  const grupos = FACETAS[col] || [];
  let html = '';
  grupos.forEach(g => {
    const sel = COLF[col].sel[g.k];
    const vis = opcoesGrupo(col, g, mapa[g.k], busca);
    if(grupos.length > 1) html += `<div class="pop-grupo">${esc(g.t)}</div>`;
    if(!vis.length){ html += '<div class="pop-vazio">Nenhuma opção com esse texto.</div>'; return; }
    const todasOn = vis.every(v => sel.has(v));
    html += opHTML(g.k, '__todas__', todasOn ? 'Desmarcar todas' : 'Selecionar todas', null, todasOn, ' todos');
    vis.forEach(v => html += opHTML(g.k, v, v, mapa[g.k].get(v) || 0, sel.has(v), ''));
  });
  document.getElementById('popLista').innerHTML = html || '<div class="pop-vazio">Esta coluna não tem opções.</div>';
  document.getElementById('popInfo').textContent = filtrados.length + ' de ' + CONTRATOS.length;
  const [campo, dir] = String(F.sort).split('-');
  document.getElementById('popOrdAsc').classList.toggle('on', campo === col && dir === 'asc');
  document.getElementById('popOrdDesc').classList.toggle('on', campo === col && dir === 'desc');
}
/* O valor vai num data-attribute, não dentro de um onclick: nome de empresa
   tem aspas e apóstrofo, e montar código com isso dentro quebra. */
function opHTML(gk, valor, texto, n, marcada, extra){
  return '<label class="pop-op'+extra+'">'
    + '<input type="checkbox" data-g="'+esc(gk)+'" data-v="'+esc(valor)+'"'+(marcada ? ' checked' : '')+'>'
    + '<span class="op-txt">'+esc(texto)+'</span>'
    + (n === null ? '' : '<span class="op-n">'+n+'</span>')
    + '</label>';
}
function popMarcar(gk, valor){
  const col = popCol;
  if(!col) return;
  const g = (FACETAS[col] || []).find(x => x.k === gk);
  const sel = COLF[col].sel[gk];
  if(!g || !sel) return;
  if(valor === '__todas__'){
    const vis = opcoesGrupo(col, g, contarOpcoes(col)[gk], normalizar(document.getElementById('popBusca').value));
    const todasOn = vis.every(v => sel.has(v));
    vis.forEach(v => todasOn ? sel.delete(v) : sel.add(v));
  } else {
    if(sel.has(valor)) sel.delete(valor); else sel.add(valor);
  }
  aplicarFiltros();
  renderPop();
  if(sheetAberta()) renderFiltrosMobile();
}
function popDigitou(){
  if(!popCol) return;
  COLF[popCol].txt = normalizar(document.getElementById('popBusca').value.trim());
  aplicarFiltros();
  renderPop();
  if(sheetAberta()) renderFiltrosMobile();
}
function popLimpar(){ if(popCol) limparColuna(popCol); }
function popOrdenar(dir){ if(popCol){ ordenarPor(popCol, dir); renderPop(); } }

/* ══════════════ RENDER DA TABELA ══════════════ */
function badgeSit(c){
  if(c.situacao==='ATIVO') return '<span class="badge badge-ativo">✅ ATIVO</span>';
  if(c.situacao==='ATIVO-PARALIZADO') return '<span class="badge badge-par">⏸️ PARALISADO</span>';
  return '<span class="badge badge-inativo">INATIVO</span>';
}
function badgeVenc(c){
  const d=c._d;
  if(d===null) return '<span class="badge badge-venc bv-gray">Sem data</span>';
  if(!isAtivo(c)) return `<span class="badge badge-venc bv-gray">📅 ${fmtD(c.vencimento)}</span>`;
  if(d<0) return `<span class="badge badge-venc bv-red">⚠️ VENCIDO há ${-d}d · ${fmtD(c.vencimento)}</span>`;
  if(d<=30) return `<span class="badge badge-venc bv-red">⏰ Vence em ${d}d · ${fmtD(c.vencimento)}</span>`;
  if(d<=90) return `<span class="badge badge-venc bv-amber">⏰ Vence em ${d}d · ${fmtD(c.vencimento)}</span>`;
  return `<span class="badge badge-venc bv-green">📅 ${fmtD(c.vencimento)}</span>`;
}
function linhaHTML(c){
  /* Célula sem conteúdo não leva rótulo: no celular os rótulos viram texto
     visível (::before), e um "fiscais" solto sem nome seria ruído. */
  const cel = (classe, valor, rotulo) => valor
    ? `<td class="${classe}" data-label="${rotulo}">${valor}</td>`
    : `<td class="${classe} vazia"></td>`;
  const fis = fiscais(c);
  return `<tr onclick="abrirDet(${c.id})">
    <td class="c-num"><span class="n-num">Nº ${esc(c.contr)}/${esc(c.ano)}</span>${c.modalidade?`<span class="n-mod">${esc(c.modalidade)}</span>`:''}</td>
    <td class="c-emp">${esc(c.empresa)||'—'}</td>
    <td class="c-obj">${esc(c.objeto)}</td>
    ${cel('c-sec', esc((c.secretarias||[]).join(', ')), 'Secretaria')}
    ${cel('c-tipo', esc(c.tipo), 'Tipo')}
    ${cel('c-fis', esc(fis.slice(0,3).join(', '))+(fis.length>3?' +'+(fis.length-3):''), 'Fiscais')}
    <td class="c-sit">${badgeSit(c)}</td>
    <td class="c-venc">${badgeVenc(c)}</td>
    <td class="c-valor">${money(c.valor)}</td>
  </tr>`;
}
function renderMais(){
  const corpo = document.getElementById('corpo');
  if(!filtrados.length){
    document.getElementById('vazio').innerHTML =
      '<div class="empty"><span>🔍</span>Nenhum contrato encontrado com esses filtros.<br>Ajuste a busca ou <u style="cursor:pointer" onclick="limparFiltros()">limpe os filtros</u>.</div>';
    document.getElementById('loadWrap').style.display = 'none';
    document.getElementById('resultCount').innerHTML = '';
    return;
  }
  const fatia = filtrados.slice(mostrando, mostrando+LOTE);
  corpo.insertAdjacentHTML('beforeend', fatia.map(linhaHTML).join(''));
  mostrando += fatia.length;
  const faltam = filtrados.length - mostrando;
  document.getElementById('loadWrap').style.display = faltam>0 ? '' : 'none';
  document.getElementById('btnMais').textContent = `Carregar mais (${faltam} restantes) ↓`;
  document.getElementById('resultCount').innerHTML =
    `Exibindo <b>${mostrando}</b> de <b>${filtrados.length}</b> contrato${filtrados.length>1?'s':''}`;
}

/* ══════════════ RELATÓRIOS PDF (jsPDF) ══════════════ */
let repScope = 'filtro';
const repSel = { secretaria: new Set(), fiscal: new Set() };  /* vazio = todos */
function abrirModalRelatorio(){ document.getElementById('ovRep').classList.add('open'); onTipoRel(); }
function fecharRep(){ document.getElementById('ovRep').classList.remove('open'); }
function setScope(btn){ document.querySelectorAll('[data-scope]').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); repScope = btn.dataset.scope; renderRepSel(); }
function tipoRel(){ const el=document.querySelector('[name=repTipo]:checked'); return el?el.value:'geral'; }

/* universo de secretarias / fiscais dentro da abrangência escolhida */
function universoRel(tipo){
  const mapa = {};
  baseItens(repScope).forEach(c=>{
    const chaves = tipo==='secretaria'
      ? (c.secretarias.length?c.secretarias:['(SEM SECRETARIA)'])
      : (fiscais(c).length?fiscais(c):['(SEM FISCAL DEFINIDO)']);
    chaves.forEach(k=>mapa[k]=(mapa[k]||0)+1);
  });
  return Object.entries(mapa).sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0],'pt-BR'));
}
function onTipoRel(){
  const tipo = tipoRel();
  const wrap = document.getElementById('repSelWrap');
  const mostra = (tipo==='secretaria' || tipo==='fiscal');
  wrap.style.display = mostra ? '' : 'none';
  if(!mostra) return;
  document.getElementById('repSelTitle').textContent = tipo==='secretaria' ? 'Quais secretarias incluir?' : 'Quais fiscais incluir?';
  document.getElementById('repSelBusca').placeholder = tipo==='secretaria' ? '🔎 Filtrar secretarias...' : '🔎 Digite o nome do fiscal...';
  renderRepSel();
}
function renderRepSel(){
  const tipo = tipoRel();
  if(tipo!=='secretaria' && tipo!=='fiscal') return;
  const busca = document.getElementById('repSelBusca').value.trim().toLowerCase();
  const uni = universoRel(tipo);
  const sel = repSel[tipo];
  /* remove seleções que não existem mais na abrangência */
  const validas = new Set(uni.map(u=>u[0]));
  [...sel].forEach(k=>{ if(!validas.has(k)) sel.delete(k); });
  const vis = uni.filter(([k])=>!busca || k.toLowerCase().includes(busca));
  document.getElementById('repSelList').innerHTML = vis.length
    ? vis.map(([k,n])=>`<label class="sel-item ${sel.has(k)?'on':''}" onclick="toggleRepSel(event,'${k.replace(/'/g,"\\'")}')"><span class="tick">✓</span>${esc(k)} <span class="qt">${n}</span></label>`).join('')
    : '<span style="font-size:12.5px;color:var(--muted)">Nenhum resultado para essa busca.</span>';
  document.getElementById('repSelCount').innerHTML = sel.size
    ? `<b>${sel.size}</b> de ${uni.length} selecionado(s) — o PDF trará apenas esses grupos.`
    : `Nenhum marcado: o PDF trará <b>todos os ${uni.length}</b> grupos.`;
}
function toggleRepSel(ev, chave){
  ev.preventDefault();
  const tipo = tipoRel(); const sel = repSel[tipo];
  sel.has(chave) ? sel.delete(chave) : sel.add(chave);
  renderRepSel();
}
function repSelTodos(marcar){
  const tipo = tipoRel(); const sel = repSel[tipo];
  sel.clear();
  if(marcar) universoRel(tipo).forEach(([k])=>sel.add(k));
  renderRepSel();
}
/* PDF direto do filtro da tela, sem abrir modal */
function pdfDoFiltro(){
  if(!filtrados.length){ alert('Nenhum contrato no filtro atual. Ajuste a busca e tente novamente.'); return; }
  gerarRelatorio('geral','filtro');
}

function pdfBase(){
  if(!window.jspdf||!window.jspdf.jsPDF){ alert('Biblioteca PDF ainda carregando. Aguarde alguns segundos e tente novamente.'); return null; }
  return new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
}
const PW=297, PH=210, ML=12, MR=12, MT=26, MB=14, CW=PW-ML-MR;

function pdfHeader(doc, titulo, sub){
  doc.setFillColor(18,41,77); doc.rect(0,0,PW,18,'F');
  doc.setFillColor(232,160,32); doc.rect(0,18,PW,1.2,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(12);
  doc.text('PREFEITURA MUNICIPAL DE IJUÍ — GESTÃO DE CONTRATOS', ML, 8);
  doc.setFontSize(10); doc.setTextColor(246,185,59);
  doc.text(titulo.toUpperCase(), ML, 14.5);
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(210,220,240);
  const dt = new Date().toLocaleString('pt-BR');
  doc.text('Emitido em ' + dt, PW-MR, 8, {align:'right'});
  if(sub) doc.text(sub, PW-MR, 14.5, {align:'right'});
}
function pdfFooter(doc){
  const n = doc.getNumberOfPages();
  for(let i=1;i<=n;i++){
    doc.setPage(i);
    doc.setDrawColor(200,208,225); doc.setLineWidth(.3); doc.line(ML,PH-9,PW-MR,PH-9);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(120,130,155);
    doc.text('Sistema de Gestão de Contratos · Município de Ijuí (protótipo)', ML, PH-5);
    doc.text(`Página ${i} de ${n}`, PW-MR, PH-5, {align:'right'});
  }
}

/* colunas: Nº/Ano | Empresa | Objeto | Secretaria | Fiscais | Vencimento | Situação | Valor */
const COLS = [
  {t:'Nº/Ano', w:16, f:c=>`${c.contr}/${c.ano}`},
  {t:'Empresa', w:44, f:c=>c.empresa||'—'},
  {t:'Objeto', w:88, f:c=>c.objeto||'—'},
  {t:'Secretaria', w:24, f:c=>c.secretarias.join(', ')||'—'},
  {t:'Fiscais', w:34, f:c=>fiscais(c).join(', ')||'—'},
  {t:'Vencimento', w:20, f:c=>fmtD(c.vencimento)},
  {t:'Situação', w:22, f:c=>c.situacao||'—'},
  {t:'Valor (R$)', w:25, f:c=>c.valor==null?'—':fmtBRL.format(c.valor).replace('R$','').trim(), right:true},
];
function pdfTableHeader(doc, y){
  doc.setFillColor(26,58,107); doc.rect(ML,y,CW,7,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(255,255,255);
  let x=ML+2;
  COLS.forEach(col=>{ doc.text(col.t, col.right? x+col.w-4 : x, y+4.7, col.right?{align:'right'}:undefined); x+=col.w; });
  return y+7;
}
function pdfRows(doc, itens, yStart, tituloPag, sub){
  let y = yStart;
  doc.setFont('helvetica','normal'); doc.setFontSize(7.3);
  let zebra = false;
  itens.forEach(c=>{
    const cells = COLS.map(col=>doc.splitTextToSize(String(col.f(c)), col.w-4.5));
    const h = Math.max(...cells.map(l=>l.length))*3.1 + 2.6;
    if(y+h > PH-MB){
      doc.addPage(); pdfHeader(doc, tituloPag, sub); y = pdfTableHeader(doc, MT-4);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.3);
    }
    if(zebra){ doc.setFillColor(238,242,250); doc.rect(ML,y,CW,h,'F'); }
    zebra = !zebra;
    /* destaque vencimento */
    const d=c._d;
    let x=ML+2;
    COLS.forEach((col,i)=>{
      if(i===5 && isAtivo(c) && d!==null && d<=30) doc.setTextColor(192,40,42);
      else if(i===5 && isAtivo(c) && d!==null && d<=90) doc.setTextColor(192,112,0);
      else doc.setTextColor(35,42,60);
      const lines = cells[i];
      lines.forEach((ln,li)=> doc.text(ln, col.right? x+col.w-4 : x, y+3.4+li*3.1, col.right?{align:'right'}:undefined));
      x+=col.w;
    });
    doc.setTextColor(35,42,60);
    y += h;
  });
  return y;
}
function pdfGroupHeader(doc, txt, extra, y, tituloPag, sub){
  if(y+14 > PH-MB){ doc.addPage(); pdfHeader(doc, tituloPag, sub); y = MT-4; }
  doc.setFillColor(231,238,251); doc.rect(ML,y,CW,7.5,'F');
  doc.setDrawColor(46,93,168); doc.setLineWidth(.7); doc.line(ML,y,ML,y+7.5);
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(30,74,138);
  doc.text(txt, ML+3, y+5.1);
  if(extra){ doc.setFontSize(8); doc.text(extra, PW-MR-2, y+5.1, {align:'right'}); }
  return pdfTableHeader(doc, y+8.5);
}
function pdfSubtotal(doc, itens, y){
  if(y+7 > PH-MB) return y; /* subtotal cabe; se não, omite discretamente */
  doc.setFont('helvetica','bold'); doc.setFontSize(7.8); doc.setTextColor(26,58,107);
  doc.text(`Subtotal: ${itens.length} contrato(s)`, PW-MR-2, y+4, {align:'right'});
  return y+7;
}
function baseItens(sc){
  sc = sc || repScope;
  if(sc==='filtro') return [...filtrados];
  if(sc==='ativos') return CONTRATOS.filter(isAtivo);
  return [...CONTRATOS];
}
function scopeLabel(sc){
  sc = sc || repScope;
  if(sc!=='filtro') return sc==='ativos' ? 'Todos os contratos ativos' : 'Todos os contratos cadastrados';
  const p = [];
  if(F.busca) p.push('busca "'+document.getElementById('fBusca').value.trim()+'"');
  COLUNAS.forEach(col => {
    const f = COLF[col];
    if(f.txt) p.push(NOME_COL[col]+' com "'+f.txt+'"');
    (FACETAS[col] || []).forEach(g => {
      const sel = f.sel[g.k];
      if(!sel || !sel.size) return;
      const vals = [...sel];
      p.push(g.t+': '+(vals.length <= 3 ? vals.join(', ') : vals.slice(0,3).join(', ')+' +'+(vals.length-3)));
    });
  });
  return `Filtro da tela: ${filtrados.length} contrato(s)` + (p.length? ' — '+p.join(' · ') : '');
}
function gerarRelatorio(tipoForce, scopeForce){
  const tipo = tipoForce || tipoRel();
  const sc = scopeForce || repScope;
  const doc = pdfBase(); if(!doc) return;
  const itens = baseItens(sc);
  if(!itens.length){ alert('Nenhum contrato na abrangência selecionada.'); return; }
  const sub = scopeLabel(sc);
  let titulo='', arquivo='';

  if(tipo==='geral'){
    titulo = (tipoForce==='geral' && scopeForce==='filtro') ? 'Relatório dos contratos filtrados' : 'Relatório geral de contratos';
    arquivo = (tipoForce==='geral' && scopeForce==='filtro') ? 'contratos_filtro' : 'contratos_geral';
    pdfHeader(doc,titulo,sub);
    let y = pdfTableHeader(doc, MT-4);
    y = pdfRows(doc, itens, y, titulo, sub);
    if(y+8>PH-MB){ doc.addPage(); pdfHeader(doc,titulo,sub); y=MT-4; }
    doc.setFillColor(26,58,107); doc.rect(ML,y+2,CW,8,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(246,185,59);
    doc.text(`TOTAL: ${itens.length} contrato(s)`, PW-MR-3, y+7.4, {align:'right'});
  }

  if(tipo==='secretaria'){
    titulo='Contratos por secretaria'; arquivo='contratos_por_secretaria';
    const grupos = {};
    itens.forEach(c=>{ (c.secretarias.length?c.secretarias:['(SEM SECRETARIA)']).forEach(s=>{ (grupos[s]=grupos[s]||[]).push(c); }); });
    let chaves = Object.keys(grupos).sort((a,b)=>a.localeCompare(b,'pt-BR'));
    if(!tipoForce && repSel.secretaria.size) chaves = chaves.filter(k=>repSel.secretaria.has(k));
    if(!chaves.length){ alert('Nenhuma secretaria selecionada tem contratos nessa abrangência.'); return; }
    if(repSel.secretaria.size && !tipoForce){ arquivo += '_selecao'; titulo += ' (seleção)'; }
    pdfHeader(doc,titulo,sub);
    let y = MT-4;
    chaves.forEach(sec=>{
      const its = grupos[sec].sort((a,b)=>(a._d===null?1e9:a._d)-(b._d===null?1e9:b._d));
      y = pdfGroupHeader(doc, sec, `${its.length} contrato(s)`, y, titulo, sub);
      y = pdfRows(doc, its, y, titulo, sub);
      y = pdfSubtotal(doc, its, y);
    });
  }

  if(tipo==='vencimento'){
    titulo='Contratos por vencimento'; arquivo='contratos_por_vencimento';
    pdfHeader(doc,titulo,sub);
    const faixas = [
      ['⚠ JÁ VENCIDOS', c=>c._d!==null&&c._d<0],
      ['VENCEM EM ATÉ 30 DIAS', c=>c._d!==null&&c._d>=0&&c._d<=30],
      ['VENCEM DE 31 A 60 DIAS', c=>c._d!==null&&c._d>30&&c._d<=60],
      ['VENCEM DE 61 A 90 DIAS', c=>c._d!==null&&c._d>60&&c._d<=90],
      ['VENCEM DE 91 A 180 DIAS', c=>c._d!==null&&c._d>90&&c._d<=180],
      ['VENCEM APÓS 180 DIAS', c=>c._d!==null&&c._d>180],
      ['SEM DATA DE VENCIMENTO', c=>c._d===null],
    ];
    let y = MT-4;
    faixas.forEach(([lab,fn])=>{
      const its = itens.filter(fn).sort((a,b)=>(a._d===null?1e9:a._d)-(b._d===null?1e9:b._d));
      if(!its.length) return;
      y = pdfGroupHeader(doc, lab, `${its.length} contrato(s)`, y, titulo, sub);
      y = pdfRows(doc, its, y, titulo, sub);
      y = pdfSubtotal(doc, its, y);
    });
  }

  if(tipo==='fiscal'){
    titulo='Contratos por fiscal'; arquivo='contratos_por_fiscal';
    const grupos = {};
    itens.forEach(c=>{ const fs=fiscais(c); (fs.length?fs:['(SEM FISCAL DEFINIDO)']).forEach(f=>{ (grupos[f]=grupos[f]||[]).push(c); }); });
    let chaves = Object.keys(grupos).sort((a,b)=>a.localeCompare(b,'pt-BR'));
    if(!tipoForce && repSel.fiscal.size) chaves = chaves.filter(k=>repSel.fiscal.has(k));
    if(!chaves.length){ alert('Nenhum fiscal selecionado tem contratos nessa abrangência.'); return; }
    if(repSel.fiscal.size && !tipoForce){ arquivo += '_selecao'; titulo += ' (seleção)'; }
    pdfHeader(doc,titulo,sub);
    let y = MT-4;
    chaves.forEach(f=>{
      const its = grupos[f].sort((a,b)=>(a._d===null?1e9:a._d)-(b._d===null?1e9:b._d));
      y = pdfGroupHeader(doc, 'FISCAL: '+f.toUpperCase(), `${its.length} contrato(s)`, y, titulo, sub);
      y = pdfRows(doc, its, y, titulo, sub);
      y = pdfSubtotal(doc, its, y);
    });
  }

  pdfFooter(doc);
  doc.save(arquivo + '_' + new Date().toISOString().slice(0,10) + '.pdf');
  fecharRep();
}

/* Ficha individual do contrato */
function pdfContratoAtual(){
  const c = detAtual; if(!c) return;
  if(!window.jspdf||!window.jspdf.jsPDF){ alert('Biblioteca PDF ainda carregando. Aguarde e tente novamente.'); return; }
  const doc = new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const W=210, L=15, CWp=W-30;
  doc.setFillColor(18,41,77); doc.rect(0,0,W,22,'F');
  doc.setFillColor(232,160,32); doc.rect(0,22,W,1.2,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text('PREFEITURA MUNICIPAL DE IJUÍ — GESTÃO DE CONTRATOS', L, 10);
  doc.setFontSize(11); doc.setTextColor(246,185,59);
  doc.text(`FICHA DO CONTRATO Nº ${c.contr}/${c.ano}`, L, 17.5);
  let y = 33;
  const item = (k,v)=>{
    if(!v) return;
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(107,119,147);
    doc.text(k.toUpperCase(), L, y); y+=4.5;
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(28,36,51);
    const lines = doc.splitTextToSize(String(v), CWp);
    lines.forEach(ln=>{ if(y>282){doc.addPage(); y=20;} doc.text(ln, L, y); y+=5; });
    y+=3;
  };
  item('Situação', c.situacao + (isAtivo(c)&&c._d!==null ? (c._d<0?` (vencido há ${-c._d} dias)`:` (faltam ${c._d} dias)`):''));
  item('Empresa', c.empresa);
  item('Secretaria(s)', c.secretarias.join(', '));
  item('Modalidade', c.modalidade);
  item('Tipo de contrato', c.tipo);
  item('Objeto', c.objeto);
  item('Valor total (contrato + aditivos)', money(c.valor));
  item('Vencimento', fmtD(c.vencimento));
  item('Fiscal administrativo', c.fiscalAdm.join(', '));
  item('Fiscal técnico', c.fiscalTec.join(', '));
  item('Palavra-chave', c.palavra);
  item('Observações', c.obs);
  doc.setDrawColor(200,208,225); doc.line(L,287,W-15,287);
  doc.setFontSize(7.5); doc.setTextColor(120,130,155);
  doc.text('Emitido em ' + new Date().toLocaleString('pt-BR') + ' · Sistema de Gestão de Contratos (protótipo)', L, 292);
  doc.save(`contrato_${c.contr}-${c.ano}.pdf`);
}

/* ══════════════ INICIALIZAÇÃO ══════════════ */
document.addEventListener('keydown', e=>{
  if(e.key!=='Escape') return;
  if(popCol){ fecharPop(); return; }        /* Esc fecha primeiro o menu da coluna */
  fecharDet(); fecharRep(); fecharFiltrosMobile();
});
/* fecha os modais com o botão voltar do celular */
window.addEventListener('popstate', ()=>{ fecharPop(); fecharDet(); fecharRep(); fecharFiltrosMobile(); });

/* A tarja do cabeçalho diz de onde vieram os dados — sem ela não dá para
   saber, olhando a tela, se o Firestore respondeu ou se caiu no arquivo. */
function marcarFonte(){
  const chip = document.querySelector('.proto-chip');
  if(!chip) return;
  chip.textContent = CONTRATOS.length + ' CONTRATOS · '
    + (FONTE_DADOS === 'firestore' ? 'DADOS AO VIVO' : 'ARQUIVO LOCAL');
}

function iniciar(){
  CONTRATOS.forEach(c => { c._d = dias(c.vencimento); });   /* pré-processa datas */
  marcarFonte();
  initFiltros();
  aplicarFiltros();
  /* A busca fica sempre à vista, também no celular: procurar é o motivo de a
     página existir. Os recortes por coluna ficam a um clique, no cabeçalho da
     tabela (no celular, no botão "Filtros e ordem"). */
}

carregarContratos().then(d => { CONTRATOS = d; iniciar(); }).catch(e => {
  console.error('Erro ao carregar os contratos:', e);
  const alvo = document.getElementById('vazio');
  if(alvo) alvo.innerHTML =
    '<div class="empty"><span>⚠️</span>Não foi possível carregar os contratos.<br>' + esc(e.message) + '</div>';
});
</script>
