<!--
  Arquivo e Anulações — /arquivo/   (PROTÓTIPO)

  As quatro planilhas que este módulo substitui (ANULAÇÕES, MEMORANDOS,
  Controle do Arquivo e PROCESSOS, com 30 abas somadas) contam a mesma
  história de quatro jeitos: um papel saiu daqui, foi parar com alguém, e
  precisa voltar. Só isso. O que muda entre uma aba e outra é quem recebeu
  e com que nome se chama a ida.

  Por isso a tela não tem uma aba por planilha. Ela abre na única pergunta
  que nenhuma das quatro sabe responder:

      O QUE ESTÁ FORA AGORA, COM QUEM, E HÁ QUANTOS DIAS?

  Nos dados de verdade do ano, essa pergunta tem 51 respostas — e a mais
  antiga está fora há 182 dias. Ninguém escondeu: está lá, numa linha de uma
  aba, com a coluna "DATA RETORNO" vazia. Célula vazia não chama ninguém.
  O resto do módulo (anulações, arquivo, memorandos) existe para alimentar
  essa primeira tela sem trabalho dobrado.

  PROTÓTIPO: lê os arquivos de dados/*.json, convertidos das planilhas pelo
  ferramentas/planilhas-para-json.py. Não grava, não pede login e não fala
  com o Firestore. É para olhar, clicar e dizer o que muda — a ligação com
  o banco e o portão de acesso vêm depois de o desenho estar certo, como
  foi feito em /requisicao/.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a3a6b">
<link rel="icon" href="../logo-ijui.jpg">
<title>Arquivo e Anulações – Município de Ijuí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#1a3a6b; --navy-mid:#1e4a8a; --navy-dark:#12294d; --navy-light:#2e5da8;
    --gold:#e8a020; --card:#fff; --bg:#eaeef6; --text:#1c2433; --muted:#6b7793;
    --border:#dde4f0; --shadow:0 2px 10px rgba(20,40,80,.07); --shadow-md:0 6px 22px rgba(20,40,80,.10);
    --blue-bg:#e7eefb; --blue-text:#1e4a8a;
    --green:#2a8a3a; --green-bg:#e6f4ea;
    --red:#c0282a;   --red-bg:#fbe7e7;
    --amber:#c07000; --amber-bg:#fef3dc;
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',Arial,sans-serif;font-size:15px;color:var(--text);min-height:100vh;
    background:radial-gradient(1200px 600px at 100% -10%,rgba(46,93,168,.10),transparent 60%),
               radial-gradient(900px 500px at -10% 0%,rgba(232,160,32,.07),transparent 55%),var(--bg);
    background-attachment:fixed;-webkit-font-smoothing:antialiased}
  header{background:#fff;padding:0 32px;position:sticky;top:0;z-index:100;box-shadow:0 3px 16px rgba(15,32,80,.15);
    border-bottom:4px solid;border-image:linear-gradient(90deg,var(--navy) 0%,var(--navy-light) 55%,var(--gold) 100%) 1}
  .header-inner{max-width:1380px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;min-height:74px;gap:20px}
  .logo-wrap{display:flex;align-items:center;gap:18px;min-width:0}
  .logo-mark{width:46px;height:46px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(26,58,107,.18),inset 0 0 0 1.5px var(--border);flex-shrink:0;padding:6px}
  .logo-mark img{width:100%;height:100%;object-fit:contain;display:block}
  .logo-divider{width:2px;height:44px;background:var(--border);border-radius:2px}
  .logo-text h1{font-size:18px;color:var(--navy);font-weight:700;line-height:1.2;white-space:nowrap}
  .logo-text p{font-size:11.5px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:2px}
  .proto-chip{background:var(--amber-bg);color:var(--amber);border:1.5px solid #f0d9a8;border-radius:20px;
    padding:6px 14px;font-size:11.5px;font-weight:800;letter-spacing:.6px;white-space:nowrap}

  main{max-width:1380px;margin:0 auto;padding:24px 32px 70px}

  /* ── Abas ── */
  .abas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
  .aba{background:#fff;border:1.5px solid var(--border);color:var(--navy);border-radius:12px;padding:11px 20px;
    font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:9px;transition:.15s}
  .aba:hover{border-color:var(--navy-light);background:var(--blue-bg)}
  .aba.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .aba .n{background:rgba(0,0,0,.10);border-radius:20px;padding:1px 9px;font-size:12px;font-weight:800}
  .aba.on .n{background:rgba(255,255,255,.22)}
  .aba.alerta:not(.on){border-color:#e9b9b9;background:var(--red-bg);color:var(--red)}
  .aba.alerta:not(.on) .n{background:rgba(192,40,42,.13)}

  /* ── Cartões de resumo ── */
  .resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
  .rc{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
  .rc .rot{font-size:10.5px;font-weight:800;letter-spacing:1.4px;color:var(--muted);text-transform:uppercase}
  .rc .val{font-size:28px;font-weight:800;color:var(--navy);margin-top:6px;line-height:1.1}
  .rc .sub{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}
  .rc.perigo{border-color:#e9b9b9;background:linear-gradient(180deg,#fff,#fdf4f4)}
  .rc.perigo .val{color:var(--red)}
  .rc.bom{border-color:#bfe3c6;background:linear-gradient(180deg,#fff,#f4faf5)}
  .rc.bom .val{color:var(--green)}

  /* ── Blocos por pessoa ── */
  .pessoa{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
    margin-bottom:16px;overflow:hidden}
  .pessoa-cab{display:flex;align-items:center;gap:14px;padding:16px 22px;background:linear-gradient(135deg,var(--navy-dark),var(--navy-mid) 70%);color:#fff;flex-wrap:wrap}
  .pessoa-nome{font-size:17px;font-weight:800;letter-spacing:.3px}
  .pessoa-conta{background:rgba(255,255,255,.16);border-radius:20px;padding:4px 13px;font-size:12.5px;font-weight:700}
  .pessoa-pior{margin-left:auto;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.12);border-radius:20px;padding:5px 14px}
  .linha{display:flex;align-items:center;gap:14px;padding:13px 22px;border-top:1px solid var(--border);flex-wrap:wrap}
  .linha:hover{background:#f8fafd}
  .selo-dias{min-width:92px;text-align:center;border-radius:10px;padding:7px 10px;font-size:13px;font-weight:800;flex-shrink:0}
  .d-novo{background:var(--green-bg);color:var(--green)}
  .d-medio{background:var(--amber-bg);color:var(--amber)}
  .d-velho{background:var(--red-bg);color:var(--red)}
  .doc{flex:1;min-width:210px}
  .doc b{font-size:14.5px}
  .doc .met{font-size:12.5px;color:var(--muted);margin-top:3px}
  .etq{display:inline-block;background:var(--blue-bg);color:var(--blue-text);border-radius:6px;padding:2px 9px;
    font-size:11px;font-weight:800;letter-spacing:.4px;margin-right:6px}
  .btn-voltou{background:var(--green-bg);color:var(--green);border:1.5px solid #bfe3c6;border-radius:10px;
    padding:8px 15px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
  .btn-voltou:hover{background:#d8eede}

  /* ── Tabelas ── */
  .painel{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .painel-cab{padding:16px 22px;border-bottom:1.5px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .painel-cab h2{font-size:16px;color:var(--navy);font-weight:800}
  .busca{flex:1;min-width:220px;max-width:420px;border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;
    font-family:inherit;font-size:14px;background:#f8fafd}
  .busca:focus{outline:none;border-color:var(--navy-light);background:#fff}
  table{width:100%;border-collapse:collapse}
  th{background:#f5f8fc;text-align:left;font-size:10.5px;font-weight:800;letter-spacing:1.1px;color:var(--muted);
    text-transform:uppercase;padding:11px 14px;border-bottom:1.5px solid var(--border);white-space:nowrap}
  td{padding:11px 14px;border-bottom:1px solid #eef2f8;font-size:13.5px;vertical-align:top}
  tbody tr:hover{background:#f8fafd}
  .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .vazio{padding:48px 20px;text-align:center;color:var(--muted)}
  .vazio span{display:block;font-size:34px;margin-bottom:10px}
  .conta{font-size:12.5px;color:var(--muted);margin-left:auto}

  .nota{background:var(--blue-bg);border-left:4px solid var(--navy-light);border-radius:0 12px 12px 0;
    padding:14px 18px;font-size:13.5px;line-height:1.6;color:var(--navy-dark);margin-bottom:20px}
  .nota b{font-weight:800}

  /* ── Barra de filtros ──
     As opções não são lista fixa: saem do que existe nos dados, com a
     contagem de cada uma. Secretaria que não aparece no cadastro não vira
     opção de filtro — filtro que promete o que não tem faz procurar onde
     não há. */
  .barra{background:#fff;border:1.5px solid var(--border);border-radius:14px;box-shadow:var(--shadow);
    padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .barra .busca{margin:0}
  .fgrupo{position:relative}
  .fbtn{background:#f6f9fc;border:1.5px solid var(--border);color:var(--navy);border-radius:10px;padding:9px 14px;
    font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
  .fbtn:hover{border-color:var(--navy-light);background:var(--blue-bg)}
  .fbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .fbtn .seta{font-size:9px;opacity:.65}
  .fpop{position:absolute;top:calc(100% + 6px);left:0;z-index:60;background:#fff;border:1.5px solid var(--border);
    border-radius:14px;box-shadow:var(--shadow-md);min-width:250px;max-width:330px;padding:8px;display:none}
  .fpop.open{display:block}
  .fpop-lista{max-height:290px;overflow:auto}
  .fop{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:13.5px}
  .fop:hover{background:#f4f8fd}
  .fop input{width:16px;height:16px;accent-color:var(--navy-light);cursor:pointer;flex-shrink:0}
  .fop .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fop .qt{background:#eef3fa;color:var(--muted);border-radius:20px;padding:1px 8px;font-size:11.5px;font-weight:800}
  .fpop-pe{border-top:1px solid var(--border);margin-top:6px;padding-top:7px;display:flex;justify-content:space-between}
  .flink{background:none;border:none;color:var(--navy-light);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;padding:5px 8px}
  .flink:hover{text-decoration:underline}

  /* Período: segmentado, porque "os últimos que vieram" é UMA escolha, não
     várias marcadas ao mesmo tempo. */
  .segm{display:flex;border:1.5px solid var(--border);border-radius:10px;overflow:hidden;background:#f6f9fc}
  .segm button{background:none;border:none;border-right:1px solid var(--border);padding:9px 13px;
    font-family:inherit;font-size:12.5px;font-weight:700;color:var(--navy);cursor:pointer;white-space:nowrap}
  .segm button:last-child{border-right:none}
  .segm button:hover{background:var(--blue-bg)}
  .segm button.on{background:var(--navy);color:#fff}
  .fsel{border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:13px;
    font-weight:700;color:var(--navy);background:#f6f9fc;cursor:pointer}
  .fsel:focus{outline:none;border-color:var(--navy-light)}
  .fconta{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
  .chip{background:var(--blue-bg);color:var(--blue-text);border:1.5px solid #cddcf5;border-radius:20px;
    padding:5px 8px 5px 13px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px}
  .chip .x{cursor:pointer;background:rgba(30,74,138,.14);border-radius:50%;width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1}
  .chip .x:hover{background:rgba(30,74,138,.28)}
  .chip-limpar{background:var(--red-bg);color:var(--red);border-color:#eec4c4;cursor:pointer;padding:5px 13px}
  @media(max-width:760px){
    header{padding:0 16px} main{padding:18px 16px 60px}
    .logo-text p{display:none} .pessoa-pior{margin-left:0;width:100%}
    /* No celular o cabeçalho não cabe numa linha só: em vez de espremer o
       título até sumir, a etiqueta de protótipo desce para a segunda. */
    .header-inner{flex-wrap:wrap;padding:10px 0;gap:10px}
    .logo-text h1{font-size:16px}
    .proto-chip{font-size:10.5px;padding:5px 11px}
    .barra{padding:10px}
    .barra .busca{min-width:100%;max-width:none}
    .fconta{margin-left:0}
    .segm button{padding:9px 11px}
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo-wrap">
      <div class="logo-mark"><img src="../logo-ijui.jpg" alt="Ijuí"></div>
      <div class="logo-divider"></div>
      <div class="logo-text">
        <h1>Arquivo e Anulações</h1>
        <p>Coordenadoria de Compras — COPAM</p>
      </div>
    </div>
    <span class="proto-chip" id="chipProto">PROTÓTIPO · DADOS DE 2026</span>
  </div>
</header>

<main>
  <div class="abas" id="abas"></div>
  <div id="tela"></div>
</main>

<script>
/* ══════════════ DADOS ══════════════
   No protótipo vêm dos arquivos convertidos das planilhas. Em produção
   viram quatro coleções do Firestore — e a consulta da primeira tela é a
   pequena de propósito: "voltouEm == null" traz 51 documentos, não os 978
   do ano. A lição custou caro nos outros módulos (/contratos/ lia 1.300
   documentos por abertura) e já nasce aplicada aqui. */
let TRAMITES = [], ANULACOES = [], MEMORANDOS = [], PASTAS = [];
const HOJE = new Date();

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtD(iso){ if(!iso) return '—'; const p=String(iso).split('-'); return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso; }
const fmtBRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
function money(v){ return (v==null||isNaN(v)) ? '—' : fmtBRL.format(v); }
function dias(iso){
  if(!iso) return null;
  const p = String(iso).split('-'); if(p.length!==3) return null;
  const d = new Date(+p[0], +p[1]-1, +p[2]);
  if(isNaN(d)) return null;
  return Math.round((HOJE - d)/86400000);
}
/* A cor é do PRAZO, não do gosto: até uma semana é o tempo normal de uma
   assinatura (a mediana medida nos dados é 1 dia); um mês fora já é outra
   conversa. */
function classeDias(n){ return n==null?'d-novo' : n>30?'d-velho' : n>7?'d-medio' : 'd-novo'; }

function abertos(){ return TRAMITES.filter(t => t.saiuEm && !t.voltouEm); }
function normalizar(s){ return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }

/* ══════════════ ABAS ══════════════ */
const TELAS = [
  {id:'rua',  rot:'📍 Na rua',     conta:()=>abertos().length, alerta:true},
  {id:'anul', rot:'✂️ Anulações',  conta:()=>ANULACOES.length},
  {id:'arq',  rot:'🗄️ Arquivo',    conta:()=>PASTAS.length},
  {id:'memo', rot:'📨 Memorandos', conta:()=>MEMORANDOS.length}
];
let telaAtual = 'rua';
function renderAbas(){
  document.getElementById('abas').innerHTML = TELAS.map(t =>
    '<button class="aba'+(telaAtual===t.id?' on':'')+(t.alerta&&t.conta()?' alerta':'')+'" onclick="irPara(\''+t.id+'\')">'
    + t.rot + '<span class="n">' + t.conta() + '</span></button>').join('');
}
function irPara(id){ telaAtual = id; fecharPop(); renderAbas(); render(); window.scrollTo({top:0,behavior:'smooth'}); }

/* ══════════════ MOTOR DE FILTROS ══════════════
   Um só, para as quatro telas. Cada tela diz de onde vem a lista, qual é a
   data que conta como "quando veio", que facetas oferece e em que ordens
   pode ficar. O resto — marcar, contar, limpar, mostrar o que está ativo —
   é o mesmo código, e por isso o comportamento não varia de aba para aba.

   As opções são DINÂMICAS: saem dos dados carregados, com a contagem de
   cada uma, e a contagem já considera os outros filtros ligados. Assim o
   menu diz a verdade sobre o que vai trazer, em vez de oferecer uma
   secretaria que, com o período escolhido, não tem nenhuma linha. */
const CFG = {
  rua: {
    lista: () => abertos(),
    data: 'saiuEm', rotData: 'saída',
    busca: t => [t.docTipo, t.docNum, t.comQuem, t.secretaria, t.tipo].join(' '),
    facetas: [
      {k:'comQuem',    rot:'Com quem',   v:t => t.comQuem || '(sem destino)'},
      {k:'tipo',       rot:'Tipo',       v:t => t.tipo || '—'},
      {k:'docTipo',    rot:'Documento',  v:t => t.docTipo || '—'},
      {k:'secretaria', rot:'Secretaria', v:t => t.secretaria || '(não anotada)'}
    ],
    ordens: [
      {k:'antigo',  rot:'Fora há mais tempo', f:(a,b) => (dias(b.saiuEm)||0) - (dias(a.saiuEm)||0)},
      {k:'recente', rot:'Saiu por último',    f:(a,b) => (dias(a.saiuEm)||0) - (dias(b.saiuEm)||0)},
      {k:'pessoa',  rot:'Nome de quem está',  f:(a,b) => String(a.comQuem||'').localeCompare(String(b.comQuem||''),'pt-BR')}
    ]
  },
  anul: {
    lista: () => ANULACOES,
    data: 'contabilidadeEm', rotData: 'envio à contabilidade',
    busca: a => [a.credor, a.requisicao, a.empenho, a.memorando, a.pedido, a.num+'/'+a.ano, a.quem].join(' '),
    facetas: [
      {k:'reqSec', rot:'Secretaria', v:a => a.reqSec || '(sem sigla)'},
      {k:'quem',   rot:'Quem lançou', v:a => a.quem || '—'},
      {k:'faixa',  rot:'Faixa de valor', v:a => faixaValor(a.valor), ordem:v => FAIXAS.findIndex(f => f[0] === v)}
    ],
    ordens: [
      {k:'recente', rot:'Mais recentes',  f:(a,b) => String(b.contabilidadeEm||'').localeCompare(String(a.contabilidadeEm||''))},
      {k:'antigo',  rot:'Mais antigas',   f:(a,b) => String(a.contabilidadeEm||'').localeCompare(String(b.contabilidadeEm||''))},
      {k:'valor',   rot:'Maior valor',    f:(a,b) => (Number(b.valor)||0) - (Number(a.valor)||0)},
      {k:'numero',  rot:'Nº da anulação', f:(a,b) => (b.num||0) - (a.num||0)}
    ]
  },
  arq: {
    lista: () => PASTAS,
    data: 'arquivadoEm', rotData: 'arquivamento',
    busca: p => [p.processo, p.vencedor, p.modalidade, p.pregoeiro, p.secretaria].join(' '),
    facetas: [
      {k:'modalidade', rot:'Modalidade', v:p => p.modalidade || '—'},
      {k:'pregoeiro',  rot:'Pregoeiro',  v:p => p.pregoeiro || '(sem pregoeiro)'},
      {k:'check',      rot:'Checklist',  v:p => p.checklist ? 'Conferido' : 'Não conferido'},
      {k:'ano',        rot:'Ano',        v:p => (p.arquivadoEm||'').slice(0,4) || '(sem data)', ordem:v => -Number(v)}
    ],
    ordens: [
      {k:'recente', rot:'Arquivado por último', f:(a,b) => String(b.arquivadoEm||'').localeCompare(String(a.arquivadoEm||''))},
      {k:'antigo',  rot:'Arquivado primeiro',  f:(a,b) => String(a.arquivadoEm||'').localeCompare(String(b.arquivadoEm||''))},
      {k:'proc',    rot:'Processo (A–Z)',      f:(a,b) => String(a.processo||'').localeCompare(String(b.processo||''),'pt-BR')}
    ]
  },
  memo: {
    lista: () => MEMORANDOS,
    data: 'recebidoEm', rotData: 'recebimento',
    busca: m => [m.num, m.descricao, m.secretaria, m.entregueA].join(' '),
    facetas: [
      {k:'secretaria', rot:'Secretaria',    v:m => m.secretaria || '—'},
      {k:'entregueA',  rot:'Entregue para', v:m => m.entregueA || '(não anotado)'}
    ],
    ordens: [
      {k:'recente', rot:'Mais recentes', f:(a,b) => String(b.recebidoEm||'').localeCompare(String(a.recebidoEm||''))},
      {k:'antigo',  rot:'Mais antigos',  f:(a,b) => String(a.recebidoEm||'').localeCompare(String(b.recebidoEm||''))},
      {k:'sec',     rot:'Secretaria (A–Z)', f:(a,b) => String(a.secretaria||'').localeCompare(String(b.secretaria||''),'pt-BR')}
    ]
  }
};
const FAIXAS = [
  ['Até R$ 1 mil',        v => v != null && v < 1000],
  ['R$ 1 mil a 10 mil',   v => v != null && v >= 1000 && v < 10000],
  ['R$ 10 mil a 100 mil', v => v != null && v >= 10000 && v < 100000],
  ['Acima de R$ 100 mil', v => v != null && v >= 100000]
];
function faixaValor(v){
  if(v == null) return '(sem valor)';
  const f = FAIXAS.find(([, teste]) => teste(v));
  return f ? f[0] : '(sem valor)';
}
/* Períodos prontos: "os últimos que vieram" é a pergunta mais feita, e
   pedir duas datas para respondê-la seria cobrar caro por pouco. */
const PERIODOS = [
  {k:'tudo', rot:'Tudo',      d:null},
  {k:'7',    rot:'7 dias',    d:7},
  {k:'30',   rot:'30 dias',   d:30},
  {k:'90',   rot:'90 dias',   d:90}
];

/* Estado por tela: cada aba guarda o que estava filtrado nela. Trocar de
   aba e voltar não desmancha o que a pessoa montou. */
const F = {};
function est(tela){
  if(!F[tela]){
    const cfg = CFG[tela];
    F[tela] = {busca:'', sel:{}, periodo:'tudo', ordem:cfg.ordens[0].k};
    cfg.facetas.forEach(f => { F[tela].sel[f.k] = new Set(); });
  }
  return F[tela];
}
function passaFaceta(item, cfg, e, pular){
  return cfg.facetas.every(f => {
    if(f.k === pular) return true;
    const s = e.sel[f.k];
    return !s || !s.size || s.has(f.v(item));
  });
}
function passaPeriodo(item, cfg, e){
  if(e.periodo === 'tudo') return true;
  const n = dias(item[cfg.data]);
  return n != null && n <= Number(e.periodo);
}
function passaBusca(item, cfg, e){
  if(!e.busca.trim()) return true;
  return normalizar(cfg.busca(item)).includes(normalizar(e.busca));
}
/* pular: ao contar as opções de uma faceta, ela mesma não entra no filtro —
   senão marcar "SMED" faria as outras secretarias sumirem da lista e não
   haveria como marcar uma segunda. */
function filtrar(tela, pular){
  const cfg = CFG[tela], e = est(tela);
  return cfg.lista().filter(x => passaBusca(x, cfg, e) && passaPeriodo(x, cfg, e) && passaFaceta(x, cfg, e, pular));
}
function ordenada(tela){
  const cfg = CFG[tela], e = est(tela);
  const ord = cfg.ordens.find(o => o.k === e.ordem) || cfg.ordens[0];
  return filtrar(tela).slice().sort(ord.f);
}

/* ── Desenho da barra ── */
let popAberto = null;
function fecharPop(){ popAberto = null; document.querySelectorAll('.fpop.open').forEach(p => p.classList.remove('open')); }
document.addEventListener('click', ev => {
  if(!popAberto) return;
  if(ev.target.closest('.fgrupo')) return;
  fecharPop();
});
function abrirPop(tela, k){
  const jaEstava = popAberto === k;
  fecharPop();
  if(jaEstava) return;
  popAberto = k;
  const el = document.getElementById('pop-' + k);
  if(el) el.classList.add('open');
}
function contarOpcoes(tela, faceta){
  const base = filtrar(tela, faceta.k);
  const conta = {};
  base.forEach(x => { const v = faceta.v(x); conta[v] = (conta[v] || 0) + 1; });
  let chaves = Object.keys(conta);
  if(faceta.ordem) chaves.sort((a, b) => faceta.ordem(a) - faceta.ordem(b));
  else chaves.sort((a, b) => conta[b] - conta[a] || a.localeCompare(b, 'pt-BR'));
  return chaves.map(k => [k, conta[k]]);
}
function barra(tela){
  const cfg = CFG[tela], e = est(tela);
  const total = cfg.lista().length, vistos = filtrar(tela).length;

  let h = '<div class="barra">';
  h += '<input class="busca" placeholder="Procurar…" value="' + esc(e.busca)
     + '" oninput="est(\'' + tela + '\').busca=this.value;render()">';

  /* período — uma escolha só */
  h += '<div class="segm">' + PERIODOS.map(p =>
        '<button class="' + (e.periodo === p.k ? 'on' : '') + '" title="pela data de ' + esc(cfg.rotData)
        + '" onclick="est(\'' + tela + '\').periodo=\'' + p.k + '\';render()">' + p.rot + '</button>').join('') + '</div>';

  /* facetas — várias marcadas ao mesmo tempo */
  cfg.facetas.forEach(f => {
    const s = e.sel[f.k], ops = contarOpcoes(tela, f);
    h += '<div class="fgrupo">'
       + '<button class="fbtn' + (s.size ? ' on' : '') + '" onclick="abrirPop(\'' + tela + '\',\'' + f.k + '\')">'
       + esc(f.rot) + (s.size ? ' · ' + s.size : '') + '<span class="seta">▼</span></button>'
       + '<div class="fpop" id="pop-' + f.k + '"><div class="fpop-lista">';
    if(!ops.length) h += '<div style="padding:12px;color:var(--muted);font-size:13px">Nada para filtrar aqui.</div>';
    ops.forEach(([v, n]) => {
      h += '<label class="fop"><input type="checkbox"' + (s.has(v) ? ' checked' : '')
         + ' onchange="marcar(\'' + tela + '\',\'' + f.k + '\',this.dataset.v)" data-v="' + esc(v) + '">'
         + '<span class="txt" title="' + esc(v) + '">' + esc(v) + '</span><span class="qt">' + n + '</span></label>';
    });
    h += '</div><div class="fpop-pe">'
       + '<button class="flink" onclick="limparFaceta(\'' + tela + '\',\'' + f.k + '\')">Limpar</button>'
       + '<button class="flink" onclick="fecharPop();render()">Pronto</button>'
       + '</div></div></div>';
  });

  /* ordem */
  h += '<select class="fsel" onchange="est(\'' + tela + '\').ordem=this.value;render()">'
     + cfg.ordens.map(o => '<option value="' + o.k + '"' + (e.ordem === o.k ? ' selected' : '') + '>↕ '
       + esc(o.rot) + '</option>').join('') + '</select>';

  h += '<span class="fconta">' + vistos + ' de ' + total + '</span>';
  h += '</div>';

  /* o que está ligado, em chips que se tiram um a um */
  const chips = [];
  if(e.busca.trim()) chips.push(['“' + esc(e.busca.trim()) + '”', "limparBusca('" + tela + "')"]);
  if(e.periodo !== 'tudo') chips.push(['últimos ' + e.periodo + ' dias', "est('" + tela + "').periodo='tudo';render()"]);
  cfg.facetas.forEach(f => {
    [...e.sel[f.k]].forEach(v => {
      chips.push([esc(f.rot) + ': ' + esc(v), "marcar('" + tela + "','" + f.k + "'," + JSON.stringify(v) + ")"]);
    });
  });
  if(chips.length){
    h += '<div class="chips">' + chips.map(([t, acao]) =>
         '<span class="chip">' + t + '<span class="x" onclick="' + acao.replace(/"/g, '&quot;') + '">✕</span></span>').join('')
       + '<span class="chip chip-limpar" onclick="limparTudo(\'' + tela + '\')">limpar tudo</span></div>';
  }
  return h;
}
function marcar(tela, k, v){
  const s = est(tela).sel[k];
  if(s.has(v)) s.delete(v); else s.add(v);
  render();
}
function limparFaceta(tela, k){ est(tela).sel[k] = new Set(); render(); }
function limparBusca(tela){ est(tela).busca = ''; render(); }
function limparTudo(tela){
  const e = est(tela);
  e.busca = ''; e.periodo = 'tudo';
  CFG[tela].facetas.forEach(f => { e.sel[f.k] = new Set(); });
  fecharPop(); render();
}

/* ══════════════ TELA 1: NA RUA ══════════════
   Agrupada POR PESSOA, e não por tipo de documento, porque é assim que a
   pendência se resolve: não se cobra "as inexigibilidades", se fala com o
   Andrei. A planilha ordena por data de lançamento, que é a ordem de quem
   escreve — esta ordena por quem tem de agir. */
function telaRua(){
  const fora = ordenada('rua');
  const todos = abertos();
  const velhos = fora.filter(t => (dias(t.saiuEm) || 0) > 30);
  const pior = fora.length ? Math.max.apply(null, fora.map(t => dias(t.saiuEm) || 0)) : 0;
  const oPior = fora.find(t => (dias(t.saiuEm) || 0) === pior);

  let h = '<div class="resumo">'
    + cartao(fora.length + (fora.length !== todos.length ? ' de ' + todos.length : ''), 'documentos fora',
             'saíram e não consta a volta', fora.length ? 'perigo' : 'bom')
    + cartao(velhos.length, 'fora há mais de 30 dias', 'estes não são atraso: são esquecimento', velhos.length ? 'perigo' : 'bom')
    + cartao(pior ? pior + ' dias' : '—', 'o mais antigo',
             oPior ? esc(oPior.docTipo + ' ' + (oPior.docNum || '') + ' · ' + (oPior.comQuem || '')) : 'nada pendente', '')
    + cartao(new Set(fora.map(t => t.comQuem || '—')).size, 'pessoas com papel', 'cada bloco abaixo é uma conversa', '')
    + '</div>';

  h += '<div class="nota">Esta tela é a razão do módulo existir. As quatro planilhas têm a coluna '
     + '<b>"DATA RETORNO"</b> — mas célula vazia não chama ninguém. Aqui o que está vazio vira fila, '
     + 'ordenada por quem está esperando há mais tempo.</div>';

  h += barra('rua');

  if(!todos.length) return h + '<div class="painel"><div class="vazio"><span>✅</span>Nada fora. Todo documento que saiu, voltou.</div></div>';
  if(!fora.length) return h + '<div class="painel"><div class="vazio"><span>🔎</span>Nenhum documento com esses filtros.</div></div>';

  /* Com ordenação por pessoa, agrupa; nas outras, a ordem escolhida manda e
     o agrupamento seguiria quebrado — então vira lista corrida. */
  const e = est('rua');
  if(e.ordem === 'pessoa'){
    const porPessoa = {};
    fora.forEach(t => { const k = t.comQuem || '(sem destino anotado)'; (porPessoa[k] = porPessoa[k] || []).push(t); });
    Object.keys(porPessoa).sort((a, b) => a.localeCompare(b, 'pt-BR')).forEach(nome => {
      h += blocoPessoa(nome, porPessoa[nome]);
    });
    return h;
  }
  const porPessoa = {};
  fora.forEach(t => { const k = t.comQuem || '(sem destino anotado)'; (porPessoa[k] = porPessoa[k] || []).push(t); });
  const ordem = Object.keys(porPessoa).sort((a, b) =>
    (dias(porPessoa[b][0].saiuEm) || 0) - (dias(porPessoa[a][0].saiuEm) || 0));
  ordem.forEach(nome => { h += blocoPessoa(nome, porPessoa[nome]); });
  return h;
}
function blocoPessoa(nome, lista){
  const p = Math.max.apply(null, lista.map(t => dias(t.saiuEm) || 0));
  let h = '<div class="pessoa"><div class="pessoa-cab">'
     + '<span class="pessoa-nome">' + esc(nome) + '</span>'
     + '<span class="pessoa-conta">' + lista.length + (lista.length > 1 ? ' documentos' : ' documento') + '</span>'
     + '<span class="pessoa-pior">mais antigo: ' + p + ' dias</span></div>';
  lista.forEach(t => {
    const n = dias(t.saiuEm);
    h += '<div class="linha">'
       + '<div class="selo-dias ' + classeDias(n) + '">' + (n == null ? '—' : n + 'd') + '</div>'
       + '<div class="doc"><b>' + esc(t.docTipo || 'documento') + ' ' + esc(t.docNum || '') + '</b>'
       + '<div class="met"><span class="etq">' + esc(t.tipo || '') + '</span>'
       + (t.secretaria ? esc(t.secretaria) + ' · ' : '')
       + 'saiu em ' + fmtD(t.saiuEm) + '</div></div>'
       + '<button class="btn-voltou" onclick="marcarVolta(' + t.id + ')">✓ Voltou hoje</button>'
       + '</div>';
  });
  return h + '</div>';
}
function cartao(valor, rotulo, sub, classe){
  return '<div class="rc ' + (classe || '') + '"><div class="rot">' + esc(rotulo) + '</div>'
       + '<div class="val">' + esc(valor) + '</div><div class="sub">' + esc(sub) + '</div></div>';
}
/* No protótipo a baixa só vive na memória da aba — é para sentir o gesto:
   um clique fecha a pendência, em vez de procurar a linha certa em 30 abas. */
function marcarVolta(id){
  const t = TRAMITES.find(x => x.id === id);
  if(!t) return;
  const n = dias(t.saiuEm);
  if(!confirm('Registrar que ' + (t.docTipo || 'o documento') + ' ' + (t.docNum || '')
    + ' voltou hoje?\n\nEstá com ' + (t.comQuem || '—') + ' há ' + n + ' dias.')) return;
  const d = new Date();
  t.voltouEm = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  renderAbas(); render();
}

/* ══════════════ TELA 2: ANULAÇÕES ══════════════ */
function telaAnul(){
  const lista = ordenada('anul');
  const soma = lista.reduce((s, a) => s + (Number(a.valor) || 0), 0);
  const quem = {}; lista.forEach(a => { if(a.quem) quem[a.quem] = (quem[a.quem] || 0) + 1; });
  const secs = {}; lista.forEach(a => { if(a.reqSec) secs[a.reqSec] = (secs[a.reqSec] || 0) + 1; });
  const topo = Object.entries(secs).sort((a, b) => b[1] - a[1])[0];

  let h = '<div class="resumo">'
    + cartao(lista.length, 'anulações', 'no recorte escolhido abaixo', '')
    + cartao(money(soma), 'valor anulado', 'empenhos que voltaram para a dotação', '')
    + cartao(Object.entries(quem).map(([k, v]) => k + ' ' + v).join(' · ') || '—', 'quem lançou', 'a planilha guarda isso entre parênteses no número', '')
    + cartao(topo ? topo[0] : '—', 'secretaria que mais anula', topo ? topo[1] + ' anulações' : '', '')
    + '</div>';

  h += '<div class="nota">Cada anulação já cita a <b>requisição interna</b> (ex.: <code>09-72-2026-SMED</code>) '
     + 'e o <b>memorando</b> que a pediu. São ponteiros para coisas que o sistema já tem: a requisição vive em '
     + '<b>/requisicao/</b> e o memorando, na aba ao lado. Hoje a ligação existe só na cabeça de quem digitou.</div>';

  h += barra('anul');
  h += '<div class="painel">';
  if(!lista.length) return h + '<div class="vazio"><span>🔎</span>Nenhuma anulação com esses filtros.</div></div>';

  h += '<table><thead><tr><th>Nº</th><th>Requisição</th><th>Memorando</th><th>Pedido</th><th>Empenho</th>'
     + '<th>Credor</th><th class="num">Valor</th><th>Contabilidade</th><th>Voltou</th></tr></thead><tbody>';
  lista.slice(0, 300).forEach(a => {
    h += '<tr><td><b>' + a.num + '/' + a.ano + '</b><div style="font-size:11px;color:var(--muted)">' + esc(a.quem || '') + '</div></td>'
       + '<td>' + esc(a.requisicao || '—') + '</td>'
       + '<td>' + esc(a.memorando || '—') + '</td>'
       + '<td>' + esc(a.pedido || '—') + '</td>'
       + '<td><b>' + esc(a.empenho || '—') + '</b></td>'
       + '<td>' + esc(a.credor || '—') + '</td>'
       + '<td class="num">' + money(a.valor) + '</td>'
       + '<td>' + fmtD(a.contabilidadeEm) + '</td>'
       + '<td>' + fmtD(a.retornoEm) + '</td></tr>';
  });
  h += '</tbody></table>';
  if(lista.length > 300) h += '<div class="vazio" style="padding:16px">mostrando as 300 primeiras — use os filtros acima</div>';
  return h + '</div>';
}

function render(){

/* ══════════════ CARGA ══════════════
   Duas cargas possíveis, e a diferença importa:

   dados/*.json          a de verdade, convertida das planilhas do setor.
                         NÃO está no repositório — este aqui é público —,
                         então só existe na máquina de quem rodou o
                         conversor.
   dados/exemplo/*.json  fictícia, escrita à mão, versionada. É o que roda
                         no ar, para a tela poder ser clicada por qualquer
                         um sem expor credor, valor e assunto de memorando.

   Tenta a real primeiro; não achando, cai no exemplo. E diz na tela qual
   das duas está vendo — protótipo que não avisa com que dado está falando
   é protótipo que vira decisão errada. */
function carregar(){
  const puxa = (pasta, n) => fetch(pasta + n + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  const quatro = pasta => Promise.all(
    ['tramites','anulacoes','memorandos','pastas'].map(n => puxa(pasta, n)));

  return quatro('dados/').then(r => {
    const achouReal = r.some(x => Array.isArray(x) && x.length);
    return achouReal ? {r: r, real: true}
                     : quatro('dados/exemplo/').then(e => ({r: e, real: false}));
  }).then(({r, real}) => {
    const [t, a, m, pa] = r.map(x => Array.isArray(x) ? x : []);
    TRAMITES = t; ANULACOES = a; MEMORANDOS = m; PASTAS = pa;
    const n = t.length + a.length + m.length + pa.length;
    if(!n){
      document.getElementById('tela').innerHTML =
        '<div class="painel"><div class="vazio"><span>📂</span>Não achei os dados.<br>'
        + '<span style="font-size:13px">Rode <code>python3 arquivo/ferramentas/planilhas-para-json.py PASTA --gravar</code></span></div></div>';
      return;
    }
    const chip = document.getElementById('chipProto');
    chip.textContent = real ? ('PROTÓTIPO · ' + n + ' REGISTROS DE 2026')
                            : ('PROTÓTIPO · ' + n + ' REGISTROS DE EXEMPLO');
    if(!real) chip.title = 'Dados fictícios. A carga real das planilhas fica fora do repositório.';
    renderAbas(); render();
    if(!real){
      const t0 = document.getElementById('tela');
      t0.insertAdjacentHTML('afterbegin',
        '<div class="nota" style="background:var(--amber-bg);border-left-color:var(--amber);color:#6b4500">'
        + '<b>Estes números são de mentira.</b> A tela está rodando com dados de exemplo, inventados só para '
        + 'ela poder ser clicada aqui no ar. A carga de verdade — 2.468 registros das quatro planilhas — não '
        + 'entra neste repositório, que é público: ela sai do conversor e fica na máquina de quem rodou. '
        + 'O desenho é o mesmo nos dois casos.</div>');
    }
  });
}
carregar();
</script>
