name: Backup diário do Firestore

on:
  schedule:
    # Sabado, 09:00 UTC = 06:00 de sabado em Brasilia — ninguem no sistema.
    #
    # SEMANAL, e nao diario, por decisao de quem cuida do sistema: o backup
    # aqui e a segunda rede, nao a primeira. A primeira, contra o que mais
    # acontece (edicao errada), e o historico de edicoes dos contratos, com
    # desfazer, que guarda 365 dias. O preco de ser semanal esta anotado e e
    # real: entre um backup e o seguinte cabem ate 7 dias de lancamento.
    #
    # Antes de qualquer coisa arriscada — importacao grande, migracao,
    # limpeza em massa — RODE NA MAO primeiro, pelo botao "Run workflow"
    # abaixo. E o que fecha o buraco dos 7 dias exatamente quando ele
    # importa.
    #
    # A hora nao e so pelo Brasil: a cota diaria do Firestore vira a
    # MEIA-NOITE DO PACIFICO, e o backup rodava as 23:00 de la — na ultima
    # hora do dia de cota, depois de o setor inteiro ter usado o sistema o
    # dia todo. Deu HTTP 429 no meio do backup. Agora ele roda as 01:00 ou
    # 02:00 do Pacifico (conforme o horario de verao de la), logo depois de
    # a cota zerar, com o dia inteiro pela frente.
    - cron: "0 9 * * 6"
  # Permite rodar na hora, pelo botão "Run workflow" na aba Actions.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      # Enquanto o secret não existir, isto fica vazio e o passo de envio para o
      # repositório privado é pulado — o backup diário segue pelo artifact.
      BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
      BACKUP_REPO: ${{ vars.BACKUP_REPO }}
      # Conta ADMIN do próprio sistema. Desde que as regras do Firestore foram
      # fechadas, ler as coleções exige login — ver CONTROLE-DE-ACESSO.md,
      # seção "Backup diário", para criar essa conta e cadastrar os secrets.
      BACKUP_EMAIL: ${{ secrets.BACKUP_EMAIL }}
      BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Baixar todas as coleções
        run: node .github/scripts/backup-firestore.mjs backup

      - name: Nome do backup
        id: nome
        run: echo "dia=$(TZ=America/Sao_Paulo date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Guardar o backup
        uses: actions/upload-artifact@v4
        with:
          name: backup-firestore-${{ steps.nome.outputs.dia }}
          path: backup/
          # Semanal: 90 dias guardavam ~90 backups diarios e agora guardariam
          # so 13. O teto do GitHub e 90 dias, entao quem cobre o passado
          # longo e o repositorio privado abaixo — nele cada backup e um
          # commit, e o historico do git nao expira.
          retention-days: 90
          if-no-files-found: error

      # Cópia permanente. O artifact acima morre em 90 dias, e ESTE repositório é
      # público (vira o site ijui.net), então o dump não pode ser commitado aqui:
      # publicaria o banco inteiro, inclusive a coleção usuarios. Vai para um
      # repositório PRIVADO, sempre nos mesmos arquivos, um commit por dia — o
      # estado atual é o backup de hoje e o histórico do git guarda os anteriores,
      # com a vantagem de o diff de cada dia mostrar o que mudou no banco.
      #
      # Pulado enquanto o secret BACKUP_TOKEN não existir (ver .github/scripts/README.md).
      - name: Enviar para o repositório privado
        if: env.BACKUP_TOKEN != ''
        env:
          DIA: ${{ steps.nome.outputs.dia }}
        run: |
          set -euo pipefail
          REPO="${BACKUP_REPO:-pacificoijui/ijui-backups}"
          echo "Enviando para $REPO"
          git clone --depth 1 "https://x-access-token:${BACKUP_TOKEN}@github.com/${REPO}.git" destino
          # o backup do dia é o único diretório criado sob backup/
          ORIGEM="$(ls -d backup/*/ | head -1)"
          rm -rf destino/atual
          mkdir -p destino/atual
          cp -r "$ORIGEM." destino/atual/
          cd destino
          git config user.name "Backup automático"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou desde o último backup."
            exit 0
          fi
          git commit -m "Backup de ${DIA}"
          git push origin HEAD
